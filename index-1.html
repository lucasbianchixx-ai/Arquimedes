const adminModules = [{"title":"Direito Administrativo e regime jurídico-administrativo","objective":"Compreender o Direito Administrativo como ramo do Direito Público, suas fontes, seus critérios de definição e a lógica das prerrogativas e sujeições que estruturam a atuação administrativa.","sections":[["1. Conceito, objeto e finalidade","O Direito Administrativo é o ramo do Direito Público que disciplina a organização, os meios, as atividades e os controles da Administração Pública, bem como as relações jurídicas decorrentes do exercício da função administrativa. Não se confunde com o estudo de toda a atividade estatal: Legislativo e Judiciário também exercem função administrativa quando organizam seus serviços, contratam pessoal ou adquirem bens. O critério funcional, portanto, é mais útil que o puramente orgânico. Seu objetivo não é conferir liberdade irrestrita ao Estado, mas viabilizar a realização dos interesses públicos constitucionalmente legítimos, sob a Constituição, a lei e os direitos fundamentais."],["2. Critérios de definição e evolução","A doutrina já explicou o ramo por critérios como o serviço público, o Poder Executivo, as relações jurídicas, os fins do Estado e a função administrativa. Nenhum critério isolado explica toda a matéria. O critério funcional considera a atividade administrativa, independentemente do órgão que a desempenha; o critério subjetivo observa os sujeitos administrativos, mas não abrange sozinho particulares que exercem função pública delegada. A formação histórica do Direito Administrativo está ligada à limitação jurídica do poder estatal. No Estado de Direito, a Administração não atua por vontade pessoal do governante: sua competência, finalidade e procedimento são juridicamente condicionados."],["3. Fontes do Direito Administrativo","A Constituição é o fundamento superior de validade de toda a atuação administrativa. A legislação inclui leis complementares e ordinárias, medidas provisórias nos limites constitucionais, decretos legislativos e outros atos normativos válidos. Regulamentos executivos detalham a execução da lei, sem poder contrariá-la ou inovar livremente na ordem jurídica. Também são relevantes os princípios gerais, a jurisprudência, os precedentes vinculantes, os costumes administrativos compatíveis com a legalidade e a doutrina. A LINDB, especialmente os arts. 20 a 30, exige atenção às consequências práticas, à segurança jurídica e à motivação das decisões públicas. Costume ou prática interna não legitima conduta contrária à lei."],["4. Regime jurídico-administrativo","A expressão designa o conjunto de princípios, prerrogativas e limitações que orienta a função administrativa. A supremacia do interesse público explica, em situações legalmente previstas, instrumentos como desapropriação, poder de polícia e cláusulas exorbitantes. Não é uma autorização genérica para sacrificar direitos: o interesse público deve ser definido à luz da Constituição, da lei, da proporcionalidade e dos direitos fundamentais. A indisponibilidade do interesse público significa que o agente não é proprietário da competência nem pode renunciar livremente a deveres públicos; atua como gestor de interesses juridicamente confiados ao Estado. As duas ideias devem ser lidas de modo constitucional e não como fórmulas absolutas."],["5. Prerrogativas, sujeições e controle","Prerrogativas são poderes instrumentais atribuídos para a realização de fins públicos, como presunção relativa de legitimidade, imperatividade em determinados atos e execução direta nas hipóteses autorizadas. Sujeições incluem legalidade, finalidade, motivação quando exigida, publicidade, impessoalidade, devido processo, controle e responsabilidade. O ato administrativo pode ser controlado internamente pela própria Administração e externamente pelo Legislativo, pelos tribunais de contas, pelo Judiciário e pela sociedade, cada qual dentro de sua competência. O controle judicial incide sobre legalidade e juridicidade, inclusive proporcionalidade e respeito a direitos, mas não substitui escolhas administrativas legítimas por preferências pessoais do julgador."],["6. Exemplo aplicado","Um município interdita estabelecimento que oferece risco sanitário. A medida pode ser legítima se houver competência, base normativa, finalidade de proteção à saúde, suporte fático e proporcionalidade. A Administração não pode, porém, interditar estabelecimento concorrente por retaliação, nem dispensar procedimento quando a lei exigir contraditório e defesa. A finalidade pública não cura desvio de finalidade; a urgência pode justificar atuação imediata em certas hipóteses, mas não elimina controle posterior nem o dever de motivação adequado ao caso."],["Estado de Direito e autonomia do ramo","A formação do Direito Administrativo está vinculada à passagem do poder pessoal para a sujeição jurídica da Administração. Di Pietro situa a autonomia do ramo no contexto do Estado de Direito, da legalidade e da separação de poderes, distinguindo a existência antiga de regras administrativas da posterior sistematização científica. Em Hely, o exame das noções preliminares inclui o conceito, as fontes, a interpretação, os sistemas administrativos e a experiência brasileira. A consequência prática é decisiva: nenhuma prerrogativa administrativa existe sem limites jurídicos."],["Regime jurídico: prerrogativas e sujeições","Di Pietro enfatiza o binômio prerrogativas e sujeições: poderes especiais são conferidos para atender necessidades coletivas, mas convivem com deveres de legalidade, finalidade, controle e respeito ao administrado. Na tradição de Hely, os poderes do administrador são instrumentos de realização do interesse público, não privilégios pessoais. Para resolver um caso, identifique primeiro a competência, depois a finalidade, a norma habilitante e as garantias do particular."]],"legislation":["Constituição Federal, arts. 5º, 37 e 70 a 75.","LINDB — Decreto-Lei nº 4.657/1942, arts. 20 a 30.","Lei nº 9.784/1999, especialmente arts. 2º e 50, aplicável diretamente à Administração Pública federal e como referência nos limites reconhecidos pela jurisprudência."],"cases":["STF, Súmula 346: a Administração Pública pode declarar a nulidade dos próprios atos.","STF, Súmula 473: a Administração pode anular atos ilegais e revogar atos por conveniência e oportunidade, respeitados direitos adquiridos e o controle judicial.","A leitura contemporânea da supremacia do interesse público exige compatibilidade com direitos fundamentais e proporcionalidade; evite tratar o princípio como autorização abstrata para qualquer restrição."],"comparisons":[["Interesse público primário","Interesse da coletividade juridicamente protegido; deve ser identificado à luz da Constituição."],["Interesse público secundário","Interesse patrimonial ou organizacional do Estado enquanto pessoa jurídica; não prevalece automaticamente sobre direitos ou sobre o interesse público primário."],["Legalidade administrativa","A Administração atua conforme a ordem jurídica e dentro das competências atribuídas; não possui liberdade geral equivalente à autonomia privada."]],"questions":[["Múltipla escolha","O Direito Administrativo é melhor compreendido como ramo que:",["Regula exclusivamente o Poder Executivo.","Disciplina a função administrativa e suas relações jurídicas.","Regula apenas serviços públicos prestados diretamente.","Trata somente dos servidores estatutários."],"B","A função administrativa pode ser exercida por diferentes Poderes e por particulares delegatários; o objeto é mais amplo que o Executivo ou o serviço público."],["Múltipla escolha","A indisponibilidade do interesse público significa que:",["Todo interesse estatal prevalece sobre direitos individuais.","O agente pode renunciar à competência se considerar conveniente.","O agente administra interesses juridicamente confiados e não pode deles dispor livremente.","A Administração nunca pode celebrar acordos."],"C","A indisponibilidade limita a atuação do agente, mas não impede acordos autorizados em lei e compatíveis com o interesse público."],["Múltipla escolha","Sobre regulamentos executivos, é correto afirmar que:",["Podem contrariar a lei em situações urgentes.","Detalham a execução da lei sem poder excedê-la.","Substituem a Constituição.","São sempre atos individuais."],"B","O regulamento executivo é subordinado à lei e não pode criar obrigações sem fundamento jurídico suficiente."],["Múltipla escolha","O princípio da supremacia do interesse público:",["É autorização ilimitada para restringir direitos.","Afasta o controle judicial.","Deve ser aplicado em conformidade com a Constituição e a proporcionalidade.","Permite desvio de finalidade quando houver vantagem administrativa."],"C","A proteção do interesse público é juridicamente limitada; não legitima arbitrariedade ou desvio de finalidade."],["Múltipla escolha","Uma prática administrativa reiterada contrária à lei:",["Torna-se válida automaticamente pelo costume.","Pode prevalecer sobre a Constituição.","Não se torna legítima apenas por ser reiterada.","Vincula o Judiciário."],"C","Costumes e práticas não convalidam ilegalidades."],["Discursiva","Explique a diferença entre supremacia e indisponibilidade do interesse público.","Resposta esperada: supremacia justifica prerrogativas legalmente previstas; indisponibilidade impede o agente de tratar o interesse público como próprio. Ambas se submetem à Constituição, à legalidade, à proporcionalidade e aos direitos fundamentais.","",""],["Discursiva","Por que o critério orgânico é insuficiente para definir o Direito Administrativo?","Resposta esperada: porque diferentes Poderes exercem função administrativa e particulares podem receber delegação de atividade pública; a análise funcional é necessária.","",""],["Discursiva","Dê um exemplo em que a finalidade pública alegada não torne legítimo um ato.","Resposta esperada: interdição usada para perseguir concorrente, remoção punitiva sem fundamento ou restrição desproporcional; a finalidade deve ser real, legal e comprovada.","",""],["Discursiva","Quais são as principais sujeições da Administração Pública?","Resposta esperada: legalidade/juridicidade, finalidade, impessoalidade, motivação quando exigida, publicidade, proporcionalidade, devido processo, controle e responsabilidade.","",""],["Discursiva","Explique a diferença entre interesse público primário e secundário e a consequência prática.","Resposta esperada: o primário corresponde aos interesses coletivos constitucionalmente protegidos; o secundário é o interesse patrimonial/organizacional do Estado e não prevalece automaticamente.","",""]],"learning_map":"Estado de Direito → função administrativa → competência legal → prerrogativas + sujeições → controle","source_note":"Meirelles, Direito Administrativo Brasileiro, 42ª ed. (2016); Di Pietro, Direito Administrativo (arquivo fornecido). Síntese didática autoral, não transcrição. Conferir a legislação superveniente."},{"title":"Princípios da Administração Pública","objective":"Identificar princípios expressos e implícitos, seu fundamento normativo e sua aplicação em decisões administrativas e controle de juridicidade.","sections":[["1. Princípios constitucionais expressos — LIMPE","O art. 37, caput, da Constituição sujeita a Administração direta e indireta de qualquer dos Poderes e entes federativos aos princípios da legalidade, impessoalidade, moralidade, publicidade e eficiência. Legalidade significa atuação conforme competência e ordem jurídica; impessoalidade impede favorecimentos e perseguições e exige que a atuação seja imputada ao Estado, não promovida como propaganda pessoal; moralidade exige probidade e lealdade institucional; publicidade dá transparência e eficácia quando a divulgação é requisito, sem afastar hipóteses legais de sigilo; eficiência demanda qualidade, economicidade e resultados, sem autorizar violação da lei."],["2. Legalidade, finalidade e motivação","A Administração não tem liberdade geral para fazer tudo o que a lei não proíbe: precisa de competência e fundamento jurídico para agir. A juridicidade amplia a análise para toda a ordem constitucional, legal e principiológica. A finalidade exige que a competência seja usada para o objetivo público que justificou sua atribuição. Motivação é a exposição dos pressupostos de fato e de direito que sustentam a decisão; permite controle e proteção contra arbitrariedade. A Lei nº 9.784/1999, art. 50, enumera situações em que atos administrativos devem ser motivados, com indicação dos fatos e fundamentos jurídicos."],["3. Razoabilidade e proporcionalidade","Razoabilidade afasta decisões incoerentes ou arbitrárias. Proporcionalidade costuma ser examinada por adequação (a medida contribui para o fim?), necessidade (há alternativa igualmente eficaz e menos restritiva?) e proporcionalidade em sentido estrito (os benefícios justificam os sacrifícios?). O teste deve ser aplicado com atenção ao contexto, à evidência e à margem de apreciação legalmente atribuída. Sanção muito superior à gravidade da infração, exigência irrelevante para habilitação ou restrição sem conexão com o risco podem revelar desproporção."],["4. Autotutela, segurança jurídica e confiança","Autotutela permite à Administração rever seus atos: anular os ilegais e revogar os válidos por razões supervenientes de conveniência e oportunidade, respeitados limites e direitos. Segurança jurídica protege estabilidade, previsibilidade e confiança legítima, especialmente diante de orientações públicas e práticas estatais que induzem comportamentos. A LINDB exige considerar consequências práticas e prevê regime de transição quando necessário para adaptação a nova interpretação. Na esfera federal, o art. 54 da Lei nº 9.784/1999 prevê decadência de cinco anos para anulação de atos favoráveis, salvo comprovada má-fé, observadas as regras legais e o regime aplicável."],["5. Continuidade, publicidade e eficiência","Continuidade impõe prestação regular dos serviços essenciais, sem significar que toda interrupção seja proibida: a legislação admite hipóteses justificadas, como emergência ou prévio aviso por razões técnicas ou inadimplemento, conforme o regime do serviço e as garantias dos usuários. Publicidade favorece controle democrático, transparência ativa e acesso à informação, mas deve conviver com proteção de dados e sigilos constitucionalmente legítimos. Eficiência não equivale apenas a rapidez ou corte de custos; exige resultados adequados, qualidade, avaliação e respeito a direitos."],["6. Colisão de princípios: método de resolução","Princípios podem apontar em direções diferentes. O intérprete deve identificar os bens constitucionais envolvidos, a base legal da medida, a intensidade da restrição, os fatos provados e as alternativas menos gravosas. Ponderação não é licença para decidir por intuição: a motivação deve explicitar por que a solução é adequada e por que alternativas foram descartadas. Em concursos, não basta invocar genericamente o “interesse público”; é necessário conectar princípio, norma, fatos e consequência."],["O art. 37 e a juridicidade","Os cinco princípios expressos do art. 37 da Constituição — legalidade, impessoalidade, moralidade, publicidade e eficiência — incidem sobre a Administração direta e indireta de todos os Poderes. Hely organiza o estudo desses princípios ao tratar da atividade administrativa. Di Pietro diferencia a legalidade estrita da submissão da Administração ao conjunto da ordem jurídica. A publicidade não afasta a proteção de dados nem o sigilo legalmente justificado."],["Autotutela não é poder ilimitado","Anular significa retirar ato inválido; revogar significa desfazer ato válido por razões de mérito administrativo, nos limites da competência e da lei. A proteção da confiança, a segurança jurídica, a decadência legal e o devido processo limitam a revisão. No âmbito federal, a Lei 9.784/1999 disciplina a motivação e a decadência de atos favoráveis; não se deve generalizar automaticamente suas regras a todos os entes federativos."]],"legislation":["Constituição Federal, arts. 5º, XXXIII, 37, caput e § 1º, e 70.","Lei nº 9.784/1999, arts. 2º, 50 e 54.","Lei nº 12.527/2011 (Lei de Acesso à Informação).","LINDB, arts. 20 a 24."],"cases":["STF, Súmula 473, sobre autotutela administrativa.","STF, Súmula Vinculante 13, que veda nepotismo nas hipóteses abrangidas pelo enunciado, em concretização dos princípios da impessoalidade e moralidade.","A jurisprudência sobre proporcionalidade deve ser consultada conforme o tema concreto; não atribua ao princípio uma solução automática sem examinar os fatos."],"comparisons":[["Legalidade","Atuação conforme a ordem jurídica e dentro da competência."],["Impessoalidade","Veda favorecimento/perseguição e promoção pessoal; assegura finalidade pública."],["Moralidade","Exige padrões jurídicos de probidade e lealdade, não mera preferência moral subjetiva."],["Publicidade","Regra de transparência, ressalvados sigilos legítimos."],["Eficiência","Qualidade e resultados com respeito à legalidade e aos direitos."]],"questions":[["Múltipla escolha","O princípio que veda a promoção pessoal de autoridade em publicidade institucional é especialmente:",["Eficiência.","Impessoalidade.","Continuidade.","Autotutela."],"B","A publicidade institucional não pode servir à promoção pessoal de agentes públicos; CF, art. 37, § 1º."],["Múltipla escolha","A eficiência administrativa:",["Permite descumprir formalidades legais sempre que houver economia.","É sinônimo exclusivo de rapidez.","Exige resultados e qualidade sem afastar os demais princípios.","Só se aplica a empresas públicas."],"C","Eficiência integra o art. 37 e deve coexistir com legalidade, moralidade, impessoalidade e garantias."],["Múltipla escolha","A proporcionalidade inclui, tradicionalmente:",["Adequação, necessidade e proporcionalidade em sentido estrito.","Competência, forma e objeto.","Hierarquia, disciplina e polícia.","Anulação, revogação e cassação."],"A","São as três etapas analíticas usuais do exame de proporcionalidade."],["Múltipla escolha","A autotutela permite:",["Anular atos ilegais e revogar atos válidos por mérito, nos limites legais.","Revogar decisões judiciais.","Afastar direitos adquiridos em qualquer hipótese.","Impedir controle judicial."],"A","É a síntese das Súmulas 346 e 473 do STF, sujeita a limites e controle."],["Múltipla escolha","A publicidade administrativa:",["Impede qualquer sigilo.","É regra, mas convive com hipóteses legítimas de sigilo e proteção de dados.","Só existe após autorização judicial.","É facultativa para toda a Administração."],"B","Transparência é regra; restrições precisam de fundamento constitucional e legal."],["Discursiva","Explique como o princípio da impessoalidade se relaciona com o nepotismo.","Resposta esperada: nomeações não podem ser usadas para favorecimento pessoal ou familiar; a vedação é concretizada, entre outros fundamentos, pela SV 13, observados seu alcance e a jurisprudência.","",""],["Discursiva","Descreva as três etapas do teste de proporcionalidade.","Resposta esperada: adequação, necessidade e proporcionalidade em sentido estrito, aplicadas aos fatos e justificadas na motivação.","",""],["Discursiva","Como a segurança jurídica limita a autotutela?","Resposta esperada: exige observar decadência quando aplicável, boa-fé, confiança legítima, contraditório em situações pertinentes e regras de transição previstas no sistema jurídico.","",""],["Discursiva","Diferencie moralidade administrativa de moral pessoal.","Resposta esperada: moralidade administrativa é padrão jurídico de probidade e lealdade institucional, aferido conforme Constituição, leis e contexto, não mera opinião subjetiva.","",""],["Discursiva","Uma autoridade restringe o acesso a dados públicos sem indicar base legal. Como analisar?","Resposta esperada: publicidade e acesso à informação são regra; a restrição deve ter fundamento legal legítimo, motivação e respeitar proporcionalidade e proteção de dados.","",""]],"learning_map":"LIMPE → motivação e finalidade → proporcionalidade → segurança jurídica → controle","source_note":"Meirelles, Direito Administrativo Brasileiro, 42ª ed. (2016); Di Pietro, Direito Administrativo (arquivo fornecido). Síntese didática autoral, não transcrição. Conferir a legislação superveniente."},{"title":"Organização administrativa brasileira","objective":"Distinguir Estado, Governo e Administração; compreender órgãos, competências e as técnicas de centralização, descentralização, concentração e desconcentração.","sections":[["1. Estado, Governo e Administração Pública","Estado é a pessoa jurídica soberana, formada por povo, território e poder soberano, organizada constitucionalmente. Governo corresponde à direção política e à definição de escolhas públicas dentro da Constituição. Administração Pública, em sentido subjetivo ou orgânico, é o conjunto de órgãos, entidades e agentes que desempenham função administrativa; em sentido objetivo ou material, é a própria atividade administrativa, como prestação de serviços, polícia administrativa, fomento e intervenção. O Legislativo e o Judiciário também administram quando cuidam de seus quadros e contratos, sem que isso se converta em função legislativa ou jurisdicional."],["2. Centralização e descentralização","Há centralização quando o próprio ente político presta a atividade por seus órgãos. Na descentralização, a atividade é atribuída a outra pessoa jurídica ou delegada a particular, conforme o modelo legal. A descentralização por outorga, normalmente instituída por lei, transfere a titularidade e a execução de determinada atividade a entidade administrativa, dentro dos limites legais; na descentralização por colaboração, transfere-se sobretudo a execução a particular mediante concessão, permissão ou outro instrumento admitido, permanecendo a titularidade pública do serviço. A distinção exata depende do setor e da legislação aplicável."],["3. Concentração e desconcentração","Concentração é a reunião de competências em menos órgãos; desconcentração é a distribuição interna de competências entre órgãos de uma mesma pessoa jurídica, criando relações de coordenação e hierarquia. Como os órgãos não têm personalidade jurídica própria, seus atos são imputados à pessoa jurídica a que pertencem, conforme as regras de competência e imputação. A desconcentração não deve ser confundida com descentralização: na primeira não surge nova pessoa jurídica; na segunda, há pessoa jurídica distinta ou delegação externa nos termos legais."],["4. Órgãos públicos: natureza e classificação","Órgão público é centro de competências instituído para desempenhar funções estatais. Em regra, não possui personalidade jurídica própria nem patrimônio independente, embora possa ter capacidade processual excepcional para defender prerrogativas institucionais, conforme a jurisprudência. A doutrina classifica órgãos, entre outros critérios, por posição (independentes, autônomos, superiores e subalternos), estrutura (simples e compostos) e atuação (singulares e colegiados). A classificação varia entre autores e serve como ferramenta analítica, não como substituto da lei de organização do órgão."],["5. Competência e hierarquia","Competência é o conjunto de atribuições conferidas por norma a órgão ou agente. Em regra, é irrenunciável, mas pode haver delegação e avocação quando a lei autoriza e os requisitos são atendidos. Na Lei nº 9.784/1999, arts. 11 a 17, a competência é exercida pelos órgãos a que foi atribuída, com hipóteses e limites de delegação e avocação; certas matérias não podem ser delegadas, como a edição de atos normativos, decisão de recursos administrativos e matérias de competência exclusiva. Hierarquia permite ordenar, coordenar, fiscalizar, rever e delegar atribuições no interior da mesma estrutura, mas não autoriza um órgão a invadir competência exclusiva ou contrariar a lei."],["6. Exemplo aplicado","Uma secretaria municipal cria departamentos internos para dividir o atendimento: há desconcentração. O município institui por lei uma autarquia para executar determinada atividade: há descentralização por entidade. O município contrata empresa concessionária para prestar serviço público: há delegação por colaboração. Se uma diretoria transfere competência a subordinado nos limites legais, pode haver delegação interna; se o agente tenta transferir competência exclusiva, o ato é inválido. Identificar se há nova pessoa jurídica é uma das formas mais rápidas de resolver questões de prova."],["Descentralização versus desconcentração","A desconcentração reparte atribuições dentro da mesma pessoa jurídica; a descentralização envolve outra pessoa jurídica ou delegação de execução a particular. A diferença é estrutural: secretaria e departamento são órgãos, enquanto autarquia é pessoa jurídica própria. A doutrina de Hely trata órgãos e agentes no capítulo sobre Administração Pública; Di Pietro sistematiza as técnicas de organização administrativa e suas consequências para competência e tutela."],["Órgãos, imputação e hierarquia","Órgãos não têm, em regra, personalidade jurídica: sua atuação é imputada à entidade a que pertencem. A hierarquia existe dentro da estrutura administrativa e autoriza direção, fiscalização e revisão nos limites legais. Entre ente político e autarquia há vinculação e controle finalístico, não uma relação hierárquica comum. Delegação e avocação exigem verificar a legislação pertinente, especialmente os arts. 11 a 17 da Lei 9.784/1999 na esfera federal."]],"legislation":["Constituição Federal, arts. 18, 37 e 175.","Decreto-Lei nº 200/1967, arts. 4º a 10, observada sua incidência e as alterações posteriores.","Lei nº 9.784/1999, arts. 11 a 17 (processo administrativo federal)."],"cases":["STF e STJ reconhecem, em hipóteses específicas, capacidade processual de órgãos para defesa de prerrogativas institucionais; isso não lhes confere personalidade jurídica geral.","A delegação e a avocação devem ser examinadas segundo a norma de competência, e não apenas pela posição hierárquica do agente."],"comparisons":[["Desconcentração","Distribuição interna de competências; mesma pessoa jurídica; órgãos ligados por hierarquia."],["Descentralização","Atuação por outra pessoa jurídica ou delegação externa; não se confunde com hierarquia interna."],["Centralização","O próprio ente presta a atividade por seus órgãos."],["Concentração","Reunião de atribuições em menos órgãos."],["Órgão","Centro de competências sem personalidade jurídica própria, em regra."],["Entidade","Pessoa jurídica administrativa ou política com personalidade própria."]],"questions":[["Múltipla escolha","A criação de departamentos dentro de uma secretaria caracteriza:",["Descentralização por outorga.","Desconcentração.","Concessão.","Privatização."],"B","Há repartição interna de competências na mesma pessoa jurídica."],["Múltipla escolha","A criação legal de uma autarquia é exemplo de:",["Desconcentração.","Centralização.","Descentralização administrativa por entidade.","Delegação hierárquica."],"C","A autarquia possui personalidade jurídica própria e integra a Administração Indireta."],["Múltipla escolha","Em regra, os órgãos públicos:",["Possuem personalidade jurídica própria.","São pessoas políticas soberanas.","Não possuem personalidade jurídica própria.","São sempre colegiados."],"C","São centros de competência integrados à pessoa jurídica."],["Múltipla escolha","A avocação de competência:",["É sempre livre.","É admitida nos limites legais e em caráter excepcional quando cabível.","Pode alcançar matéria exclusiva sem restrição.","É sinônimo de descentralização."],"B","A Lei 9.784/1999 condiciona a avocação e veda uso arbitrário."],["Múltipla escolha","Na concessão de serviço público:",["A titularidade pública desaparece.","O particular recebe soberania.","A execução é delegada por contrato, mantida a titularidade pública.","Surge necessariamente uma autarquia."],"C","A delegação transfere a execução nos termos legais, sem alienar a titularidade pública."],["Discursiva","Diferencie Administração em sentido subjetivo e objetivo.","Resposta esperada: subjetivo identifica órgãos, entidades e agentes; objetivo designa a atividade administrativa desempenhada.","",""],["Discursiva","Explique a diferença entre descentralização por outorga e por colaboração.","Resposta esperada: outorga atribui atividade a entidade administrativa nos limites legais; colaboração delega execução a particular por instrumento legal, como concessão ou permissão.","",""],["Discursiva","Por que a hierarquia não se confunde com controle finalístico?","Resposta esperada: hierarquia é vínculo interno entre órgãos; controle finalístico/supervisão ocorre entre entidade da indireta e Administração direta nos limites legais, sem subordinação hierárquica plena.","",""],["Discursiva","Um órgão público ajuíza ação para defender sua autonomia. Isso significa que tem personalidade jurídica?","Resposta esperada: não necessariamente; pode haver capacidade processual excepcional para defesa de prerrogativas institucionais sem personalidade jurídica geral.","",""],["Discursiva","Dê um exemplo de concentração e um de desconcentração.","Resposta esperada: concentração reúne competências em menos órgãos; desconcentração distribui internamente competências, por exemplo, criação de departamentos numa secretaria.","",""]],"learning_map":"Ente político → órgãos (desconcentração) | entidade distinta (descentralização) → controle de competência","source_note":"Meirelles, Direito Administrativo Brasileiro, 42ª ed. (2016); Di Pietro, Direito Administrativo (arquivo fornecido). Síntese didática autoral, não transcrição. Conferir a legislação superveniente."},{"title":"Administração Direta, Indireta e entidades paraestatais","objective":"Comparar os entes da Administração Indireta e compreender as formas de parceria com organizações sociais e serviços sociais autônomos.","sections":[["1. Administração Direta","A Administração Direta é composta pelos órgãos que integram a estrutura da União, dos estados, do Distrito Federal e dos municípios. Os órgãos não têm personalidade jurídica própria; a personalidade é do ente político. A distribuição de atribuições decorre da Constituição e das leis de organização. A União não se confunde com a República Federativa do Brasil: esta é a pessoa soberana nas relações internacionais, enquanto União, estados, DF e municípios são pessoas jurídicas de direito público interno com competências constitucionais próprias."],["2. Autarquias e fundações públicas","Autarquia é pessoa jurídica de direito público criada diretamente por lei para desempenhar atividade típica da Administração, com patrimônio e atribuições próprios, sujeita a controle finalístico e ao regime jurídico público pertinente. A Constituição prevê que fundação pública tenha sua área de atuação definida por lei; o regime das fundações pode variar conforme sua natureza e o diploma instituidor. Fundação de direito público aproxima-se do regime autárquico; fundação de direito privado tem personalidade privada, mas continua sujeita a controles públicos, princípios administrativos, concurso e regras de contratação conforme a Constituição e a legislação aplicável."],["3. Empresas públicas e sociedades de economia mista","São pessoas jurídicas de direito privado integrantes da Administração Indireta. Empresa pública tem capital integralmente público, admitida a participação de entidades da Administração conforme a lei; sociedade de economia mista é sociedade anônima cujo controle acionário votante pertence ao Poder Público, na forma legal. Ambas podem prestar serviço público ou explorar atividade econômica. A exploração direta de atividade econômica pelo Estado obedece ao art. 173 da Constituição e depende de imperativos de segurança nacional ou relevante interesse coletivo, enquanto a prestação de serviço público tem regime jurídico diferente, ainda que envolva pessoa de direito privado."],["4. Criação, controle e regime","A Constituição, art. 37, XIX, estabelece que autarquia é criada por lei específica e que empresa pública, sociedade de economia mista e fundação têm sua instituição autorizada por lei específica, cabendo à lei complementar definir áreas de atuação das fundações nos termos constitucionais. A entidade indireta tem personalidade e patrimônio próprios, mas não é independente do ordenamento nem fica fora do controle: submete-se a controle interno, externo, judicial e social, além da supervisão finalística conforme a lei. Supervisão não equivale a hierarquia e não autoriza a Administração direta a substituir arbitrariamente os gestores da entidade."],["5. Lei das Estatais","A Lei nº 13.303/2016 disciplina o estatuto jurídico de empresas públicas e sociedades de economia mista, inclusive governança, transparência, gestão de riscos, licitações e contratos. A aplicação concreta exige observar a Constituição, a lei, regulamentos internos e normas setoriais. Não se deve afirmar que estatal está sujeita exatamente ao mesmo regime de uma autarquia: sua personalidade é privada, embora haja incidência de normas públicas relevantes. Também não se deve presumir que toda estatal concorre em mercado ou que toda estatal presta serviço público; a finalidade institucional e a atividade efetiva importam."],["6. Paraestatais, organizações sociais e serviços sociais autônomos","“Entidades paraestatais” é expressão doutrinária de contornos variáveis, geralmente usada para pessoas privadas que colaboram com finalidades de interesse público sem integrar a Administração Indireta. Organizações sociais são pessoas privadas sem fins lucrativos qualificadas pelo Poder Público nos termos da Lei nº 9.637/1998, para atuação em áreas previstas, mediante contrato de gestão e metas. Não se tornam órgãos estatais nem recebem liberdade irrestrita: seleção, recursos públicos, prestação de contas, transparência e controle devem respeitar a Constituição e a legislação. Serviços sociais autônomos, como entidades do chamado Sistema S, possuem natureza privada e atuação de interesse coletivo, com regime próprio e controles relacionados à origem e ao uso dos recursos."],["7. Quadro prático de comparação","Autarquia: direito público, criada por lei, atividade típica estatal. Empresa pública: direito privado, capital integralmente público, forma societária definida em lei. Sociedade de economia mista: direito privado, forma de sociedade anônima e controle público. Organização social: pessoa privada sem fins lucrativos qualificada e parceira por contrato de gestão, não integrante da Administração Indireta. Serviço social autônomo: pessoa privada com finalidade de interesse coletivo e regime próprio, geralmente financiada por contribuições parafiscais ou outras fontes legalmente previstas."],["Administração indireta e personalidade","Autarquias são pessoas jurídicas de direito público criadas por lei específica. Empresas públicas e sociedades de economia mista são pessoas jurídicas de direito privado, sujeitas a regime híbrido; sua criação depende de autorização legal e dos atos constitutivos pertinentes. As fundações estatais exigem atenção à natureza jurídica adotada e ao regime normativo. A categoria “paraestatal” não é uniforme na doutrina e não deve ser confundida automaticamente com entidade da Administração indireta."],["Regimes e controles","O vínculo da entidade com a Administração direta não se confunde com subordinação hierárquica. É preciso distinguir tutela ou supervisão finalística, controle interno, controle externo e controle judicial. A Lei 13.303/2016 contém disciplina própria para empresas públicas e sociedades de economia mista, inclusive licitações e contratos; a Lei 14.133/2021 não substitui indistintamente esse regime."]],"legislation":["Constituição Federal, arts. 37, XIX e XX, 70, 71, 173 e 175.","Decreto-Lei nº 200/1967, art. 4º e dispositivos pertinentes.","Lei nº 13.303/2016 (estatais).","Lei nº 9.637/1998 (organizações sociais).","Lei Complementar nº 101/2000, quando pertinente à gestão fiscal e aos limites aplicáveis."],"cases":["STF, ADI 1.923/DF: reconheceu a constitucionalidade do modelo das organizações sociais com interpretação conforme, enfatizando princípios constitucionais, procedimentos públicos impessoais e controle.","A incidência de precatórios, imunidades e outros privilégios sobre estatais depende da natureza da atividade e dos requisitos constitucionais e jurisprudenciais; não se generaliza para toda empresa estatal."],"comparisons":[["Autarquia","Pessoa jurídica de direito público, criada por lei."],["Empresa pública","Pessoa jurídica de direito privado com capital integralmente público."],["Sociedade de economia mista","Pessoa jurídica de direito privado, sociedade anônima sob controle público."],["Organização social","Pessoa privada sem fins lucrativos qualificada; parceria por contrato de gestão."],["Serviço social autônomo","Pessoa privada de colaboração social, com regime legal próprio; não integra, em regra, a Administração Indireta."]],"questions":[["Múltipla escolha","A autarquia:",["É pessoa privada autorizada por contrato.","É pessoa jurídica de direito público criada por lei.","É órgão sem personalidade.","Tem capital misto."],"B","Autarquia tem personalidade de direito público e é criada diretamente por lei específica."],["Múltipla escolha","Empresa pública distingue-se da sociedade de economia mista porque:",["Nunca presta serviço público.","Seu capital é integralmente público; a sociedade de economia mista é sociedade anônima sob controle público.","É órgão da Administração Direta.","Não se sujeita a controle."],"B","A distinção central está no capital e na forma societária legal."],["Múltipla escolha","Organização social:",["É necessariamente autarquia.","É órgão público.","É pessoa privada sem fins lucrativos qualificada para parceria nos termos legais.","Não presta contas quando recebe recursos públicos."],"C","A qualificação não altera sua natureza privada e não afasta controle."],["Múltipla escolha","A supervisão ministerial sobre entidade da Administração Indireta:",["É hierarquia plena.","É controle finalístico nos limites legais.","Permite substituir qualquer decisão sem fundamento.","Elimina a personalidade da entidade."],"B","Entidades têm personalidade própria e autonomia nos limites da lei."],["Múltipla escolha","A Lei nº 13.303/2016 trata principalmente:",["Das autarquias.","Das empresas públicas e sociedades de economia mista.","Das organizações sociais exclusivamente.","Dos órgãos legislativos."],"B","A lei disciplina o estatuto jurídico das estatais."],["Discursiva","Explique a diferença entre criação e autorização para instituição de entidades.","Resposta esperada: autarquia é criada diretamente por lei específica; para empresa pública, sociedade de economia mista e fundação, a Constituição prevê autorização legal específica para instituição, observados os requisitos aplicáveis.","",""],["Discursiva","Por que não se pode aplicar automaticamente o mesmo regime jurídico a autarquias e estatais?","Resposta esperada: possuem personalidades e regimes distintos; estatais são pessoas privadas, com incidência de normas públicas específicas, e a disciplina depende de sua atividade e da legislação.","",""],["Discursiva","Resuma o modelo jurídico das organizações sociais.","Resposta esperada: entidade privada sem fins lucrativos qualificada pelo Poder Público, parceria por contrato de gestão, metas, recursos e controles; não se transforma em entidade estatal.","",""],["Discursiva","O que diferencia controle hierárquico de supervisão finalística?","Resposta esperada: hierarquia é vínculo interno entre órgãos; supervisão finalística é controle legal de resultados e finalidade sobre entidade dotada de personalidade própria.","",""],["Discursiva","Explique por que receber recursos públicos gera deveres de controle para entidade privada.","Resposta esperada: o uso de recursos públicos exige prestação de contas, transparência e observância de princípios e regras legais pertinentes, sem que isso necessariamente transforme a entidade em órgão estatal.","",""]],"learning_map":"Administração direta → autarquias / fundações / empresas públicas / sociedades de economia mista","source_note":"Meirelles, Direito Administrativo Brasileiro, 42ª ed. (2016); Di Pietro, Direito Administrativo (arquivo fornecido). Síntese didática autoral, não transcrição. Conferir a legislação superveniente."},{"title":"Poderes da Administração Pública","objective":"Reconhecer os poderes administrativos, seus pressupostos, limites e formas de controle, distinguindo exercício legítimo de abuso de poder.","sections":[["1. Poder-dever e vinculação","Poderes administrativos são instrumentos jurídicos conferidos à Administração para cumprir competências e proteger interesses públicos. Em regra, são também deveres: diante dos pressupostos legais, a autoridade não pode deixar de agir por capricho ou interesse privado. Poder vinculado ocorre quando a lei predetermina os elementos essenciais da decisão, restando pouca ou nenhuma margem de escolha. A existência de conceitos jurídicos indeterminados não torna automaticamente o ato discricionário; sua interpretação continua sujeita a controle jurídico e fundamentação."],["2. Poder discricionário e mérito administrativo","Discricionariedade é a margem de escolha juridicamente autorizada quanto à conveniência, oportunidade ou conteúdo, dentro dos limites legais. Mérito administrativo é o juízo administrativo legítimo realizado nessa margem, não uma área imune à Constituição. O Judiciário não deve substituir a escolha administrativa válida por sua própria preferência, mas pode controlar competência, finalidade, fatos determinantes, motivação, razoabilidade, proporcionalidade e direitos fundamentais. Uma decisão chamada “discricionária” não pode apoiar-se em fatos falsos, perseguição ou finalidade estranha à lei."],["3. Poder hierárquico e disciplinar","Poder hierárquico organiza relações internas: distribui tarefas, expede ordens legais, fiscaliza, delega e, nos limites jurídicos, revê atos de subordinados. Não se aplica como hierarquia geral entre pessoas jurídicas distintas. Poder disciplinar permite apurar infrações e aplicar sanções a agentes e a particulares sujeitos a vínculo especial com a Administração, respeitados competência, tipicidade administrativa possível, proporcionalidade, contraditório e ampla defesa. A existência de poder disciplinar não elimina a necessidade de processo quando a lei e a Constituição o exigem."],["4. Poder normativo ou regulamentar","O poder normativo permite editar atos gerais para executar a lei e organizar a Administração nos limites constitucionais. Regulamentos executivos especificam a aplicação legal, sem contrariar a lei nem criar, por conta própria, deveres primários sem fundamento. A Constituição, art. 84, VI, admite decretos autônomos em hipóteses delimitadas, relativas à organização e funcionamento da Administração federal quando não impliquem aumento de despesa nem criação ou extinção de órgãos, e à extinção de funções ou cargos vagos, conforme o texto constitucional. O alcance dessa competência não pode ser ampliado por analogia para contornar reserva legal."],["5. Poder de polícia","Poder de polícia é a atividade administrativa que condiciona ou restringe o exercício de direitos, liberdades, propriedade ou atividades em benefício de interesses públicos previstos em lei. Seus atributos tradicionalmente apontados incluem discricionariedade (quando houver margem), coercibilidade e autoexecutoriedade apenas quando houver base legal ou urgência que a justifique; esta última não é universal. O ciclo de polícia costuma ser descrito em ordem de legislação, consentimento, fiscalização e sanção, embora nem todo setor apresente todas as fases. A atuação deve respeitar competência, devido processo, motivação e proporcionalidade."],["6. Abuso de poder: excesso e desvio","Excesso de poder ocorre quando o agente ultrapassa os limites de sua competência; desvio de finalidade ocorre quando, mesmo competente, usa o poder para objetivo diverso daquele previsto em lei. Ambos podem invalidar o ato e gerar responsabilidade. A omissão ilegal também pode ser controlável quando havia dever jurídico de agir. Não se confunde discricionariedade com arbitrariedade: a primeira é escolha legalmente permitida; a segunda é atuação sem fundamento jurídico ou fora de limites."],["7. Caso prático integrado","Fiscal municipal multa comércio por infração sanitária comprovada, com autoridade competente e processo regular: exercício potencialmente legítimo do poder de polícia. Se a multa é aplicada por fiscal sem atribuição, há vício de competência/excesso. Se a fiscalização é usada para perseguir opositor político, há desvio de finalidade. Se o valor é desproporcional ou a defesa foi indevidamente suprimida, pode haver ilegalidade. A solução exige identificar norma de competência, fatos, finalidade, procedimento e proporcionalidade."],["Poderes como competências instrumentais","Poder hierárquico organiza e coordena a atividade interna; poder disciplinar permite apurar infrações de agentes e de particulares submetidos a vínculos específicos; poder regulamentar expede normas subordinadas à ordem jurídica; poder de polícia condiciona liberdades e propriedade nos limites da lei. Hely dedica capítulo próprio aos poderes administrativos e distingue atuação vinculada e discricionária. Discricionariedade não dispensa finalidade pública, motivação pertinente ou proporcionalidade."],["Abuso de poder e polícia administrativa","Excesso de poder ocorre quando a autoridade ultrapassa a competência; desvio de finalidade, quando usa a competência para fim diverso do previsto. No poder de polícia, diferencie consentimento, fiscalização e sanção, conforme o regime jurídico da atividade. Autoexecutoriedade não acompanha todo ato de polícia: depende de previsão legal ou de situação de urgência que a justifique. Não confunda polícia administrativa com polícia judiciária."]],"legislation":["Constituição Federal, arts. 5º, LIV e LV, 37 e 84, VI.","Código Tributário Nacional, art. 78 (conceito legal de poder de polícia para fins tributários).","Lei nº 9.784/1999, arts. 2º, 11 a 17 e 50.","Lei nº 13.874/2019, quando aplicável ao regime de liberdade econômica e aos atos de liberação."],"cases":["STF, Súmula Vinculante 5: a falta de defesa técnica por advogado no processo administrativo disciplinar não ofende, por si só, a Constituição; permanecem garantidos contraditório e ampla defesa.","STF, Súmula 473, sobre autotutela.","A delegação de atos de poder de polícia a pessoas de direito privado exige exame dos requisitos constitucionais e legais; não se deve presumir delegabilidade irrestrita de todas as fases."],"comparisons":[["Excesso de poder","Agente excede sua competência ou os limites dela."],["Desvio de finalidade","Agente usa competência para finalidade estranha à prevista em lei."],["Poder hierárquico","Organiza e controla relações internas da Administração."],["Poder disciplinar","Apura e sanciona infrações em vínculo jurídico específico."],["Poder de polícia","Condiciona direitos/atividades para proteger interesses públicos sob base legal."]],"questions":[["Múltipla escolha","O excesso de poder ocorre quando:",["O agente busca finalidade imprópria sem exceder competência.","O agente ultrapassa os limites de sua competência.","A Administração revoga ato válido.","Há descentralização."],"B","Excesso é vício relacionado à competência; desvio de finalidade diz respeito ao fim perseguido."],["Múltipla escolha","A discricionariedade administrativa:",["Afasta qualquer controle judicial.","Autoriza arbitrariedade.","É margem de escolha dentro dos limites jurídicos.","Permite ignorar fatos determinantes."],"C","Discricionariedade é juridicamente delimitada e sujeita ao controle de legalidade/juridicidade."],["Múltipla escolha","A autoexecutoriedade do poder de polícia:",["Existe em todos os atos administrativos.","É ilimitada.","Depende de base legal ou situação que justifique execução direta, conforme o regime aplicável.","Elimina contraditório em qualquer caso."],"C","Autoexecutoriedade não é atributo universal nem dispensa garantias legalmente exigidas."],["Múltipla escolha","O poder hierárquico:",["Cria subordinação entre quaisquer pessoas jurídicas.","Organiza relações internas entre órgãos e agentes.","É sinônimo de poder de polícia.","Permite descumprir lei."],"B","Hierarquia é interna e opera nos limites das competências."],["Múltipla escolha","O poder normativo:",["Pode contrariar a lei.","Permite regulamento executivo subordinado à lei e outras competências constitucionais delimitadas.","Substitui a função legislativa em geral.","É exclusivo dos municípios."],"B","O regulamento deve respeitar a lei e a reserva legal."],["Discursiva","Diferencie poder vinculado e discricionário.","Resposta esperada: vinculado tem elementos predeterminados pela norma; discricionário permite escolha dentro de limites legais, sem imunidade ao controle.","",""],["Discursiva","Explique excesso de poder e desvio de finalidade com exemplos.","Resposta esperada: excesso é extrapolação de competência; desvio é uso de competência para fim estranho, como fiscalizar para perseguir adversário.","",""],["Discursiva","Quais garantias devem ser observadas na aplicação de sanção disciplinar?","Resposta esperada: competência, previsão normativa, apuração adequada, contraditório, ampla defesa, motivação, proporcionalidade e controle.","",""],["Discursiva","Por que a autoexecutoriedade não é atributo de todo ato de polícia?","Resposta esperada: execução direta depende de autorização legal ou situação que a admita; em outras hipóteses é necessária atuação judicial ou procedimento próprio.","",""],["Discursiva","O Judiciário pode examinar um ato discricionário? Delimite o controle.","Resposta esperada: sim, para verificar juridicidade, competência, finalidade, fatos, motivação, proporcionalidade e direitos; não deve substituir escolha legítima por preferência pessoal.","",""]],"learning_map":"Competência → poder exercido → finalidade → limites → controle de excesso/desvio","source_note":"Meirelles, Direito Administrativo Brasileiro, 42ª ed. (2016); Di Pietro, Direito Administrativo (arquivo fornecido). Síntese didática autoral, não transcrição. Conferir a legislação superveniente."},{"title":"Atos administrativos","objective":"Dominar os elementos, atributos, classificação, eficácia, vícios e formas de extinção dos atos administrativos, aplicando os limites da autotutela.","sections":[["1. Conceito, existência, validade, perfeição e eficácia","Ato administrativo é manifestação unilateral da Administração, ou de quem exerça função administrativa, sob regime de direito público e destinada a produzir efeitos jurídicos. Perfeição significa que o ato completou seu ciclo de formação; validade indica conformidade com o ordenamento; eficácia é aptidão para produzir efeitos. Um ato pode estar perfeito e ser inválido, ou ser válido mas ainda não eficaz por depender de publicação, condição, termo ou aprovação. “Existência” se refere à presença dos elementos mínimos para reconhecer uma manifestação como ato; a classificação e suas consequências variam conforme a doutrina."],["2. Elementos ou requisitos","A decomposição clássica reúne competência, finalidade, forma, motivo e objeto. Competência é atribuição legal do agente; finalidade é o resultado público previsto; forma é o modo de exteriorização exigido; motivo são os pressupostos de fato e de direito; objeto é o efeito jurídico imediato. Competência e finalidade são vinculadas à lei, assim como a forma quando obrigatória. Motivo e objeto podem comportar margem discricionária quando a norma autoriza. A ausência ou defeito de elemento essencial pode comprometer a validade e, em certas hipóteses, admitir convalidação."],["3. Atributos","Presunção de legitimidade/veracidade significa que o ato é tido como conforme ao direito e os fatos afirmados gozam de presunção relativa, passível de contestação. Imperatividade permite impor obrigações independentemente da concordância do destinatário, quando cabível. Autoexecutoriedade autoriza execução material direta apenas nas hipóteses reconhecidas pelo sistema. Tipicidade, na formulação doutrinária tradicional, exige correspondência com figuras jurídicas admitidas pelo ordenamento. Não são atributos universais em intensidade idêntica: atos negociais ou enunciativos podem não ser imperativos ou autoexecutórios."],["4. Motivo, motivação e teoria dos motivos determinantes","Motivo é a situação fática e jurídica que autoriza ou exige a prática do ato; motivação é a explicitação desses fundamentos. Pela teoria dos motivos determinantes, quando a Administração declara os motivos de sua decisão, a validade fica vinculada à existência e à adequação deles, ainda que a motivação não fosse originalmente obrigatória em determinada hipótese. A teoria impede justificativas falsas ou incoerentes. A Lei nº 9.784/1999, art. 50, exige motivação em decisões específicas, com indicação dos fatos e fundamentos jurídicos, admitindo motivação por remissão quando o conteúdo referido integra a decisão de forma acessível."],["5. Vícios, convalidação e invalidação","Vícios podem atingir competência, finalidade, forma, motivo ou objeto. Nem todo defeito recebe a mesma consequência: incompetência não exclusiva e defeito formal sanável podem admitir convalidação se não houver lesão ao interesse público nem prejuízo a terceiros; desvio de finalidade e objeto ilícito, em regra, não são convalidáveis. As categorias “nulo” e “anulável” variam conforme a construção doutrinária e o regime legal; em prova, fundamente a consequência no vício e na legislação aplicável, evitando afirmar que todo ato é sempre convalidável ou que todo defeito exige efeitos idênticos."],["6. Anulação, revogação e outras formas de extinção","Anulação retira ato ilegal e pode ser feita pela Administração ou pelo Judiciário, este quando provocado e dentro de sua competência. Revogação retira ato válido por conveniência e oportunidade supervenientes e é, em regra, competência administrativa; não incide sobre atos vinculados ou situações em que a lei impede revogação. Cassação ocorre quando o beneficiário descumpre condição necessária à manutenção do ato; caducidade decorre de norma superveniente incompatível com a permanência do ato; contraposição acontece quando novo ato produz efeitos opostos que extinguem os anteriores. A classificação doutrinária pode variar, então explique o mecanismo concreto."],["7. Limites temporais e confiança","Na Administração Pública federal, o art. 54 da Lei nº 9.784/1999 prevê prazo decadencial de cinco anos para anular atos administrativos de que decorram efeitos favoráveis, salvo comprovada má-fé, com regra própria para efeitos patrimoniais contínuos. A incidência depende do regime aplicável, da natureza do ato, da boa-fé e de normas específicas. A LINDB reforça consideração de consequências práticas e proteção da segurança jurídica. A invalidação pode exigir contraditório quando afetar diretamente situação individual consolidada, conforme a natureza do procedimento e a jurisprudência."],["Elementos, atributos e espécies","Para examinar a validade do ato, utilize competência, finalidade, forma, motivo e objeto. Os atributos comumente estudados são presunção de legitimidade/veracidade, imperatividade, autoexecutoriedade e tipicidade, sem afirmar que todos aparecem em todos os atos. Hely aborda os requisitos e as espécies dos atos administrativos em capítulo específico; Di Pietro apresenta distinções sobre atributos, classificação e formas de extinção."],["Motivo, motivação e teoria dos motivos determinantes","Motivo é o pressuposto fático e jurídico; motivação é sua exposição. Quando a Administração declara razões para praticar um ato, a validade pode depender da veracidade e adequação desses fundamentos, conforme a teoria dos motivos determinantes. Diferencie anulação, revogação, convalidação, cassação e caducidade, considerando o vício, a competência e os efeitos sobre terceiros."]],"legislation":["Constituição Federal, arts. 5º, LIV e LV, e 37.","Lei nº 9.784/1999, arts. 2º, 50, 53 a 55.","LINDB, arts. 20 a 24."],"cases":["STF, Súmulas 346 e 473, sobre autotutela.","STF, Súmula Vinculante 3, sobre contraditório e ampla defesa em processos perante tribunais de contas quando a decisão puder anular ou revogar ato que beneficie o interessado, ressalvada a hipótese específica prevista no enunciado.","A exigência de contraditório em revisão administrativa depende da situação concreta e dos efeitos sobre a esfera jurídica do interessado."],"comparisons":[["Anulação","Retira ato ilegal; pode ocorrer na Administração e no Judiciário quando provocado."],["Revogação","Retira ato válido por mérito administrativo superveniente; em regra, só a Administração."],["Cassação","Extinção por descumprimento de condição pelo beneficiário."],["Caducidade","Extinção pela superveniência de norma incompatível."],["Convalidação","Saneamento de vício sanável, sem lesão ao interesse público ou prejuízo a terceiros."]],"questions":[["Múltipla escolha","Ato perfeito, válido e eficaz significa, respectivamente:",["Formação concluída; conformidade jurídica; aptidão para produzir efeitos.","Ato irrevogável; ato publicado; ato discricionário.","Ato existente; ato conveniente; ato imutável.","Ato vinculado; ato motivado; ato judicial."],"A","Os conceitos são distintos e podem não coincidir no mesmo momento."],["Múltipla escolha","O motivo do ato é:",["O formato escrito do ato.","A competência do agente.","O pressuposto fático e jurídico que fundamenta a decisão.","O resultado jurídico imediato."],"C","Motivo não se confunde com motivação nem com objeto."],["Múltipla escolha","A revogação incide, em regra, sobre:",["Ato ilegal, exclusivamente.","Ato válido cuja permanência deixou de ser conveniente ou oportuna.","Sentença judicial transitada em julgado.","Todo ato vinculado."],"B","A revogação é juízo de mérito sobre ato válido, com limites legais."],["Múltipla escolha","Pela teoria dos motivos determinantes:",["Motivos declarados são irrelevantes.","A validade pode ficar vinculada à existência e adequação dos motivos expostos.","Todo ato deve ser oral.","A motivação substitui a competência."],"B","Motivos falsos ou inadequados podem invalidar o ato."],["Múltipla escolha","A convalidação é admissível, em regra, quando:",["Qualquer vício atinge a finalidade.","O objeto é ilícito.","O vício é sanável e não há lesão ao interesse público ou prejuízo a terceiros.","O ato já foi revogado judicialmente."],"C","A Lei 9.784/1999, art. 55, delimita a convalidação."],["Discursiva","Diferencie motivo e motivação.","Resposta esperada: motivo é o pressuposto fático-jurídico; motivação é a exposição dos fundamentos da decisão.","",""],["Discursiva","Explique os cinco elementos clássicos do ato administrativo.","Resposta esperada: competência, finalidade, forma, motivo e objeto, com definição e exemplo de cada.","",""],["Discursiva","Quando a Administração deve anular e quando pode revogar?","Resposta esperada: anula por ilegalidade; revoga ato válido por conveniência e oportunidade, respeitados direitos, limites e controle judicial.","",""],["Discursiva","Um ato foi praticado por agente incompetente, mas a competência não era exclusiva. Pode haver convalidação?","Resposta esperada: pode, se o vício for sanável e a convalidação não causar lesão ao interesse público nem prejuízo a terceiros, conforme regime aplicável.","",""],["Discursiva","Qual a função do art. 54 da Lei nº 9.784/1999?","Resposta esperada: prevê decadência de cinco anos para anulação de atos favoráveis na esfera federal, salvo má-fé comprovada, com particularidades legais.","",""]],"learning_map":"Ato → competência / finalidade / forma / motivo / objeto → atributos → controle e extinção","source_note":"Meirelles, Direito Administrativo Brasileiro, 42ª ed. (2016); Di Pietro, Direito Administrativo (arquivo fornecido). Síntese didática autoral, não transcrição. Conferir a legislação superveniente."},{"title":"Serviços públicos","objective":"Entender a titularidade, os princípios, as formas de remuneração e os instrumentos de delegação e controle dos serviços públicos.","sections":[["1. Conceito, titularidade e prestação","Serviço público é atividade destinada à satisfação de necessidades coletivas, assumida pelo Estado como dever ou responsabilidade pública e submetida a regime jurídico específico, ainda que sua execução seja delegada. A noção varia conforme a Constituição, a lei e a área regulada. Titularidade não se confunde com execução: o Estado pode continuar titular e fiscalizador mesmo quando concessionária privada presta o serviço. A repartição constitucional de competências define quem deve organizar e prestar cada serviço; não se presume competência apenas por conveniência política."],["2. Princípios e requisitos","A Lei nº 8.987/1995 define serviço adequado como aquele que satisfaz condições de regularidade, continuidade, eficiência, segurança, atualidade, generalidade, cortesia na prestação e modicidade das tarifas. Atualidade abrange modernidade das técnicas, equipamentos e instalações e sua conservação, melhoria e expansão. Generalidade significa atendimento não discriminatório dentro dos requisitos legítimos. Modicidade busca tarifas razoáveis sem ignorar equilíbrio econômico-financeiro e sustentabilidade do serviço. Continuidade não significa impossibilidade absoluta de interrupção; o art. 6º, § 3º, da Lei 8.987 prevê hipóteses, observadas as condições legais."],["3. Classificações úteis","Os serviços podem ser classificados por titularidade, essencialidade, forma de fruição, possibilidade de individualização e regime de prestação. Serviços uti singuli permitem identificar usuários ou fruição individualizável, como fornecimento domiciliar de água; serviços uti universi são prestados de modo geral e indivisível, como iluminação pública em sua estrutura clássica. Essa distinção pode influenciar a forma de financiamento, mas a solução sobre taxa, tarifa ou imposto depende da Constituição e da jurisprudência específica. Também se distingue serviço público próprio, assumido pelo Estado, de atividade privada regulada, que não se torna serviço público apenas por ser importante à sociedade."],["4. Remuneração: impostos, taxas, tarifas e preços","Impostos financiam despesas gerais sem contraprestação específica individualizada. Taxas são tributos instituídos por lei em razão do exercício regular do poder de polícia ou da utilização efetiva ou potencial de serviço público específico e divisível, conforme o art. 145, II, da Constituição e o CTN. Tarifas ou preços públicos decorrem de relação de utilização do serviço sob regime não tributário, frequentemente em concessões; sua natureza não deve ser decidida apenas pelo nome dado pela Administração. A jurisprudência exige analisar o tipo de serviço, compulsoriedade, divisibilidade e regime legal."],["5. Concessão e permissão","Nos termos da Lei nº 8.987/1995, concessão é delegação da prestação de serviço público feita pelo poder concedente mediante licitação, à pessoa jurídica ou consórcio de empresas que demonstre capacidade, por sua conta e risco e por prazo determinado, conforme contrato. Permissão é delegação, precedida de licitação, a título precário, formalizada por contrato de adesão e sujeita às condições legais. A autorização aparece em diferentes setores com regimes próprios; não se deve tratá-la como instrumento universalmente equivalente à concessão ou permissão."],["6. Contrato, equilíbrio e extinção","O contrato de concessão disciplina serviço, tarifa, direitos dos usuários, fiscalização, penalidades, bens reversíveis, riscos e equilíbrio econômico-financeiro. O poder concedente regula e fiscaliza, pode aplicar sanções e, nas hipóteses legais, intervir. A concessão pode extinguir-se por advento do termo, encampação, caducidade, rescisão, anulação e falência ou extinção da concessionária, conforme lei e contrato. Encampação é retomada por interesse público durante o prazo, observadas exigências legais e indenização cabível; caducidade decorre de inadimplemento da concessionária, com procedimento e garantias. Não confundir a caducidade do contrato de concessão com a caducidade de ato administrativo em sentido geral."],["7. Direitos dos usuários e controle","A Lei nº 13.460/2017 estabelece normas de participação, proteção e defesa dos direitos do usuário de serviços públicos, incluindo atendimento adequado, igualdade, informação, manifestações e avaliação. Usuários podem recorrer a ouvidorias e instrumentos de controle social. A fiscalização pública não elimina a responsabilidade do prestador por falhas, nem a delegação afasta deveres de continuidade, segurança e qualidade. A solução de conflitos deve observar o marco regulatório específico, o contrato, o Código de Defesa do Consumidor quando juridicamente aplicável e a jurisprudência setorial."],["Serviço público e delegação","A caracterização de serviço público depende do ordenamento jurídico e do regime de prestação, não apenas de sua utilidade social. O art. 175 da Constituição prevê prestação direta ou sob concessão e permissão, sempre por meio de licitação quando cabível. Di Pietro distingue formas de prestação e delegação; Hely trata da disciplina do serviço público e dos direitos dos usuários. Não confunda titularidade estatal com execução por concessionária."],["Continuidade e direitos do usuário","Continuidade significa regularidade adequada do serviço, mas a legislação admite interrupções justificadas em hipóteses específicas. Universalidade, modicidade tarifária, eficiência, segurança e atualidade devem ser analisadas conforme a lei do setor e o contrato. A Lei 8.987/1995 disciplina concessões e permissões; a Lei 13.460/2017 estabelece direitos dos usuários de serviços públicos."]],"legislation":["Constituição Federal, arts. 21, 23, 25, 30 e 175.","Lei nº 8.987/1995 (concessões e permissões).","Lei nº 9.074/1995 (normas para outorga e prorrogações).","Lei nº 13.460/2017 (direitos dos usuários).","Código Tributário Nacional, arts. 77 a 80, para taxas de serviço e polícia."],"cases":["STF, Súmula 545: preços de serviços públicos e taxas não se confundem, sendo o regime e a compulsoriedade relevantes para a distinção.","STF, Súmula Vinculante 19: a taxa cobrada exclusivamente em razão dos serviços públicos de coleta, remoção e tratamento ou destinação de lixo proveniente de imóveis não viola o art. 145, II, quando esses serviços são específicos e divisíveis.","A distinção entre tarifa e taxa depende do regime concreto; não se conclui apenas pela nomenclatura escolhida pelo ente público."],"comparisons":[["Concessão","Delegação contratual após licitação, a pessoa jurídica/consórcio, por prazo determinado e por conta e risco."],["Permissão","Delegação precedida de licitação, formalizada por contrato de adesão, tradicionalmente descrita como precária, nos termos legais."],["Taxa","Tributo instituído por lei, ligado a poder de polícia ou serviço específico e divisível, efetivo ou potencial nos termos constitucionais."],["Tarifa/preço público","Remuneração não tributária por serviço em regime próprio, frequentemente contratual."],["Titularidade","Responsabilidade pública pela organização e fiscalização; não se transfere automaticamente com a execução delegada."]],"questions":[["Múltipla escolha","A delegação por concessão:",["Transfere a titularidade soberana ao particular.","É feita por contrato, precedida de licitação, nos termos legais.","Dispensa fiscalização estatal.","É sempre gratuita."],"B","Concessão delega a prestação, mantendo-se titularidade e fiscalização públicas."],["Múltipla escolha","Qual alternativa reúne requisitos de serviço adequado da Lei nº 8.987/1995?",["Regularidade, continuidade, eficiência, segurança, atualidade, generalidade, cortesia e modicidade.","Sigilo, exclusividade, gratuidade e ausência de fiscalização.","Lucro máximo, publicidade comercial e preferência política.","Apenas continuidade e tarifa baixa."],"A","O art. 6º, § 1º, enumera esses requisitos."],["Múltipla escolha","Taxa de serviço público exige, constitucionalmente, serviço:",["Sempre universal e indivisível.","Específico e divisível, utilizado efetiva ou potencialmente conforme a lei.","Necessariamente prestado por empresa privada.","Sempre remunerado por contrato."],"B","CF, art. 145, II, e CTN, arts. 77 a 80."],["Múltipla escolha","A Lei nº 13.460/2017 trata de:",["Direitos e participação dos usuários de serviços públicos.","Criação de autarquias.","Crimes contra a Administração.","Processo legislativo."],"A","A lei protege e disciplina a participação dos usuários."],["Múltipla escolha","A caducidade de concessão relaciona-se, em regra:",["Ao término normal do prazo.","Ao inadimplemento da concessionária, observado o procedimento legal.","À simples mudança de governo.","À vontade unilateral do usuário."],"B","Caducidade é extinção sancionatória por inexecução, com requisitos legais."],["Discursiva","Diferencie titularidade e execução de serviço público.","Resposta esperada: titularidade é responsabilidade pública pela organização e fiscalização; execução pode ser direta ou delegada.","",""],["Discursiva","Explique a diferença entre taxa e tarifa.","Resposta esperada: taxa é tributo instituído por lei e vinculado a poder de polícia ou serviço específico/divisível; tarifa é preço não tributário conforme o regime de prestação.","",""],["Discursiva","O que é equilíbrio econômico-financeiro da concessão?","Resposta esperada: preservação da equação econômico-financeira contratual nos termos legais, diante de eventos e riscos alocados no contrato; não é garantia de lucro contra todo risco.","",""],["Discursiva","Diferencie encampação e caducidade.","Resposta esperada: encampação é retomada por interesse público com requisitos e indenização legal; caducidade é extinção por inadimplemento da concessionária após procedimento.","",""],["Discursiva","Indique direitos dos usuários previstos na Lei nº 13.460/2017.","Resposta esperada: atendimento adequado, igualdade, informação, participação, manifestações, proteção e avaliação dos serviços, conforme o regime legal.","",""]],"learning_map":"Titularidade → prestação direta ou delegada → fiscalização → direitos do usuário","source_note":"Meirelles, Direito Administrativo Brasileiro, 42ª ed. (2016); Di Pietro, Direito Administrativo (arquivo fornecido). Síntese didática autoral, não transcrição. Conferir a legislação superveniente."},{"title":"Agentes públicos e servidores públicos","objective":"Classificar agentes públicos e compreender cargos, empregos e funções, formas de ingresso, estabilidade, direitos, deveres e responsabilidades.","sections":[["1. Conceito amplo e espécies","Agente público é expressão ampla para quem exerce, ainda que transitoriamente ou sem remuneração, mandato, cargo, emprego ou função pública. A classificação doutrinária pode incluir agentes políticos, servidores estatutários, empregados públicos, temporários, militares e particulares em colaboração. O regime concreto decorre da Constituição, da lei, do vínculo e da função exercida. Não é correto presumir que toda pessoa que trabalha para o Estado seja estatutária ou tenha estabilidade; tampouco se deve confundir empregado de estatal com servidor ocupante de cargo efetivo."],["2. Cargo, emprego e função","Cargo público é conjunto de atribuições criado por lei, ocupado segundo regime estatutário; emprego público é vínculo contratual trabalhista, em regra regido pela CLT, observado o regime público de ingresso e atuação; função pública designa atribuições exercidas sem necessariamente corresponder a cargo autônomo, como função de confiança ou contratação temporária. A Constituição, art. 37, II, exige concurso para investidura em cargo ou emprego público, ressalvadas nomeações para cargos em comissão declarados em lei de livre nomeação e exoneração. Funções de confiança são exercidas exclusivamente por servidores ocupantes de cargo efetivo e destinam-se a direção, chefia e assessoramento, enquanto cargos em comissão observam as condições constitucionais."],["3. Agentes políticos, temporários e colaboração","Agentes políticos exercem funções constitucionais de direção do Estado, como chefes do Executivo e membros do Legislativo; a extensão da categoria varia conforme a doutrina. Contratação temporária, prevista no art. 37, IX, exige hipótese legal, necessidade temporária de excepcional interesse público e prazo determinado, sem servir para suprir permanentemente necessidades ordinárias por burla ao concurso. Particulares em colaboração podem atuar por delegação, requisição, designação ou outra forma legal, como jurados e mesários, sem necessariamente integrar quadro permanente."],["4. Concurso, provimento e vacância","Concurso público concretiza impessoalidade, igualdade e mérito, dentro das regras do edital e da Constituição. Provimento é preenchimento de cargo, por formas previstas no regime legal; nomeação, posse e exercício são etapas distintas quando aplicáveis. Vacância é desocupação do cargo e pode decorrer de exoneração, demissão, promoção, readaptação, aposentadoria, posse em cargo inacumulável ou falecimento, conforme o regime. Regras federais da Lei nº 8.112/1990 não se aplicam automaticamente a servidores estaduais e municipais, que possuem estatutos próprios, respeitada a Constituição."],["5. Estabilidade e estágio probatório","O art. 41 da Constituição prevê estabilidade após três anos de efetivo exercício para servidores nomeados para cargo de provimento efetivo em virtude de concurso, condicionada à avaliação especial de desempenho por comissão instituída para essa finalidade. Estabilidade não é vitaliciedade e não impede perda do cargo nas hipóteses constitucionais, como sentença judicial transitada em julgado, processo administrativo com ampla defesa e avaliação periódica de desempenho na forma de lei complementar, além da hipótese fiscal prevista no art. 169. O estágio probatório avalia aptidão e desempenho conforme a legislação e a jurisprudência aplicáveis; deve-se evitar confundir prazos ou requisitos de regimes distintos."],["6. Direitos, deveres e acumulação","A Constituição disciplina teto remuneratório, concurso, greve nos termos constitucionais, associação sindical, remuneração, subsídios e acumulação. A acumulação remunerada é vedada como regra, mas o art. 37, XVI, admite exceções constitucionais com compatibilidade de horários, incluindo dois cargos de professor; um de professor com outro técnico ou científico; e dois cargos ou empregos privativos de profissionais de saúde com profissões regulamentadas. A redação constitucional deve ser consultada diretamente e aplicada sem ampliar exceções por analogia. Deveres funcionais incluem agir conforme a lei, cumprir atribuições, preservar bens públicos, atender com urbanidade e observar impedimentos e conflitos de interesse."],["7. Responsabilidades civil, penal e administrativa","O mesmo fato pode gerar responsabilidade civil, penal e administrativa, cada qual com pressupostos e procedimentos próprios. A responsabilidade administrativa decorre de infração funcional apurada conforme o regime; a civil busca reparar dano; a penal depende de tipicidade e processo criminal. Para agentes públicos, o art. 37, § 6º, estabelece responsabilidade objetiva das pessoas jurídicas de direito público e das prestadoras de serviço público pelos danos que seus agentes, nessa qualidade, causem a terceiros, assegurado direito de regresso contra o responsável nos casos de dolo ou culpa. A responsabilidade pessoal do agente não deve ser confundida com a responsabilidade estatal perante a vítima."],["8. Processo disciplinar e garantias","Sanções devem observar competência, previsão legal, procedimento, motivação, proporcionalidade, contraditório e ampla defesa. A Súmula Vinculante 5 do STF estabelece que a falta de defesa técnica por advogado no processo administrativo disciplinar não ofende, por si só, a Constituição; isso não significa ausência de defesa ou dispensa de garantias procedimentais. A prescrição, a tipificação e as sanções dependem do estatuto aplicável. A Administração deve individualizar a conduta e fundamentar a penalidade, não bastando invocar genericamente a gravidade do fato."],["Agente público: gênero e regimes","Agente público é categoria abrangente, que inclui pessoas que exercem funções estatais em diferentes vínculos. Hely apresenta classificações de agentes no capítulo sobre Administração Pública; Di Pietro sistematiza agentes públicos, servidores e vínculos funcionais. Cargo público, emprego público e função pública não são sinônimos. Servidor estatutário e empregado público estão submetidos a regimes distintos, observadas as normas constitucionais aplicáveis."],["Investidura, responsabilidade e probidade","A regra constitucional para investidura em cargo ou emprego público é concurso, ressalvadas as hipóteses constitucionais, como cargos em comissão. Acumulação remunerada é vedada como regra, com exceções expressas e compatibilidade de horários. A responsabilidade do agente pode ser civil, penal e administrativa, com pressupostos próprios. A Lei de Improbidade, após a Lei 14.230/2021, exige dolo para os tipos dos arts. 9º, 10 e 11; a abordagem de culpa existente em edições antigas de Hely precisa ser lida como histórica, não como regra atual."]],"legislation":["Constituição Federal, arts. 37 a 41, especialmente arts. 37, II, V, IX, XVI e § 6º, 39 e 41.","Lei nº 8.112/1990, para servidores públicos civis federais estatutários, dentro de seu âmbito.","Lei nº 9.784/1999, no processo administrativo federal.","Legislação local e setorial aplicável a estados, DF, municípios, militares e empregados públicos."],"cases":["STF, Súmula Vinculante 5: ausência de defesa técnica por advogado no PAD não ofende, por si só, a Constituição.","STF, Súmula Vinculante 13: vedação ao nepotismo nas hipóteses abrangidas pelo enunciado.","STF, Tema 551 (RE 1.066.677): trata dos direitos de servidores temporários e da necessidade de examinar os requisitos legais e o caso concreto para verbas como décimo terceiro e férias acrescidas de um terço.","A responsabilidade civil estatal do art. 37, § 6º, deve ser distinguida da responsabilidade regressiva do agente, para a qual a Constituição exige dolo ou culpa."],"comparisons":[["Cargo público","Vínculo estatutário, criado por lei."],["Emprego público","Vínculo contratual trabalhista, com ingresso por concurso em regra."],["Função de confiança","Exercida exclusivamente por servidor ocupante de cargo efetivo, para direção, chefia e assessoramento."],["Cargo em comissão","Livre nomeação e exoneração nos limites constitucionais e legais, destinado a direção, chefia e assessoramento."],["Estabilidade","Garantia constitucional do servidor efetivo que cumpre requisitos; não é imunidade à perda do cargo."],["Responsabilidade do Estado","Objetiva perante terceiro nos termos do art. 37, § 6º; regresso contra agente exige dolo ou culpa."]],"questions":[["Múltipla escolha","A investidura em cargo ou emprego público depende, em regra, de:",["Indicação política em qualquer hipótese.","Concurso público, ressalvadas exceções constitucionais.","Contrato verbal.","Autorização judicial individual."],"B","CF, art. 37, II, com exceção dos cargos em comissão nos termos constitucionais."],["Múltipla escolha","Funções de confiança são exercidas:",["Por qualquer particular.","Exclusivamente por servidores ocupantes de cargo efetivo.","Apenas por empregados privados.","Somente por agentes políticos."],"B","CF, art. 37, V."],["Múltipla escolha","A estabilidade do art. 41 da Constituição exige, entre outros requisitos:",["Um ano de exercício e indicação política.","Três anos de efetivo exercício em cargo efetivo obtido por concurso e avaliação especial.","De
