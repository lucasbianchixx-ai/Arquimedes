z anos em emprego privado.","Ausência de qualquer avaliação."],"B","A estabilidade não é automática pelo simples transcurso de prazo sem os requisitos constitucionais."],["Múltipla escolha","A contratação temporária do art. 37, IX, exige:",["Necessidade permanente e ordinária sem lei.","Necessidade temporária de excepcional interesse público e previsão legal.","Dispensa universal de prazo.","Estabilidade imediata."],"B","A contratação temporária não pode servir como burla permanente ao concurso."],["Múltipla escolha","A responsabilidade objetiva do Estado perante terceiro:",["Exclui sempre o direito de regresso.","Está prevista no art. 37, § 6º, e o regresso contra agente exige dolo ou culpa.","É exclusivamente penal.","Só se aplica a autarquias."],"B","A Constituição distingue responsabilidade estatal e responsabilidade regressiva do agente."],["Discursiva","Diferencie cargo, emprego e função pública.","Resposta esperada: cargo corresponde ao regime estatutário e é criado por lei; emprego é vínculo trabalhista; função é conjunto de atribuições que pode existir sem cargo autônomo, conforme a lei.","",""],["Discursiva","Quais são as exceções constitucionais à vedação de acumulação remunerada?","Resposta esperada: hipóteses do art. 37, XVI, incluindo dois cargos de professor; professor com cargo técnico/científico; dois cargos/empregos privativos de profissionais de saúde regulamentados, sempre com compatibilidade de horários.","",""],["Discursiva","Explique por que estabilidade não equivale a vitaliciedade.","Resposta esperada: estabilidade admite perda do cargo nas hipóteses constitucionais; vitaliciedade é garantia distinta, própria de certas carreiras e regida por regras específicas.","",""],["Discursiva","Diferencie responsabilidade civil do Estado e responsabilidade regressiva do agente.","Resposta esperada: Estado responde objetivamente nos termos constitucionais perante terceiro; regresso contra agente depende de dolo ou culpa.","",""],["Discursiva","Qual a função do concurso público e quais exceções merecem atenção?","Resposta esperada: concretiza igualdade, impessoalidade e mérito; exceções incluem cargos em comissão constitucionais e contratação temporária legalmente justificada, sem burla à regra.","",""]],"learning_map":"Agente → vínculo → ingresso → deveres → responsabilização → garantias processuais","source_note":"Meirelles, Direito Administrativo Brasileiro, 42ª ed. (2016); Di Pietro, Direito Administrativo (arquivo fornecido). Síntese didática autoral, não transcrição. Conferir a legislação superveniente."}];

const resourceModules = [{"title":"Teoria geral dos recursos e sistema de impugnação","objective":"Compreender a função dos recursos no devido processo legal, distinguir impugnações internas e autônomas e identificar a estrutura recursal adotada pelo CPC/2015.","sections":[["1. Conceito, finalidade e fundamento constitucional","Recurso é o meio voluntário de impugnação, previsto em lei, utilizado no mesmo processo para provocar o reexame, a invalidação, a integração ou o esclarecimento de uma decisão judicial. Sua função é permitir controle da atividade jurisdicional, correção de erros e concretização do contraditório e da ampla defesa (art. 5º, LIV e LV, da Constituição). Não existe, porém, direito irrestrito a sucessivos julgamentos: os recursos dependem de previsão legal e de requisitos de admissibilidade."],["2. Recurso não se confunde com ação autônoma","O recurso prolonga a relação processual em que a decisão foi proferida. A ação rescisória, em contraste, inaugura processo autônomo destinado a desconstituir decisão de mérito transitada em julgado nas hipóteses legais. A reclamação protege a competência e a autoridade das decisões dos tribunais, além das hipóteses constitucionais e legais de observância de precedentes. Mandado de segurança contra ato judicial é excepcional e não serve como substituto ordinário de recurso."],["3. Taxatividade e correspondência recursal","O art. 994 do CPC enumera os recursos cabíveis no processo civil: apelação, agravo de instrumento, agravo interno, embargos de declaração, recurso ordinário, recurso especial, recurso extraordinário, agravo em recurso especial ou extraordinário e embargos de divergência. A taxatividade impede a criação de recursos por convenção ou analogia. O sistema também exige adequação: cada espécie é ligada a determinados pronunciamentos e fundamentos."],["4. Duplo grau de jurisdição e limites","O duplo grau é uma garantia processual importante, mas não constitui autorização para recorrer indefinidamente nem regra constitucional absoluta aplicável sem exceções a todo procedimento. A Constituição e a legislação distribuem competências originárias e recursais. A análise deve considerar o tipo de decisão, o órgão prolator, a via legalmente prevista e os requisitos específicos."],["5. Erro de julgamento e erro de procedimento","Error in judicando é o equívoco na solução da questão de fato ou de direito, normalmente combatido para obter reforma. Error in procedendo é vício no procedimento ou na formação da decisão, que pode justificar sua anulação ou cassação. A distinção orienta o pedido recursal: reformar a conclusão não é o mesmo que invalidar o ato para que outro seja praticado regularmente."],["6. Princípios recursais fundamentais","A voluntariedade indica que a parte decide recorrer, salvo mecanismos legais específicos, como a remessa necessária, que não é recurso. A dialeticidade exige impugnação dos fundamentos relevantes da decisão. A unirrecorribilidade, como diretriz, impede o uso simultâneo de recursos incompatíveis contra o mesmo pronunciamento, ressalvadas hipóteses legais, como RE e REsp dirigidos a questões distintas. Complementam o sistema a boa-fé, a cooperação, a primazia do mérito e a proibição da decisão-surpresa."],["7. Fungibilidade e instrumentalidade","A fungibilidade permite, excepcionalmente, receber um recurso inadequado como outro quando houver dúvida objetiva sobre o cabimento, ausência de erro grosseiro e observância dos requisitos aplicáveis, inclusive tempestividade. Não autoriza ignorar texto legal claro nem escolher livremente a via recursal. A instrumentalidade das formas favorece o aproveitamento de atos que alcancem sua finalidade sem prejuízo, mas não elimina pressupostos indispensáveis."],["8. Sucedâneos recursais","Pedido de reconsideração, correição parcial, reclamação, ação rescisória, mandado de segurança e querela nullitatis não formam uma categoria uniforme. Alguns são ações autônomas, outros são instrumentos administrativos ou constitucionais, e o pedido de reconsideração é simples requerimento sem natureza recursal. Em regra, pedido de reconsideração não interrompe nem suspende o prazo do recurso cabível."]],"comparisons":[["Recurso","Impugna a decisão no mesmo processo e depende de previsão legal; em regra, impede a formação imediata da coisa julgada no capítulo impugnado."],["Ação rescisória","Ação autônoma, posterior ao trânsito em julgado, limitada às hipóteses do art. 966 do CPC e sujeita a prazo decadencial."],["Pedido de reconsideração","Requerimento dirigido ao próprio julgador; não é recurso e, como regra, não altera o prazo recursal."],["Remessa necessária","Condição legal para eficácia de certas sentenças contra a Fazenda Pública; não depende de iniciativa recursal da parte."]],"legislation":["Constituição Federal, art. 5º, XXXV, LIV e LV; CPC, arts. 9º, 10, 994 a 1.044; CPC, arts. 966 a 975 (ação rescisória); CPC, arts. 988 a 993 (reclamação)."],"cases":["A enumeração do art. 994 é taxativa; não se cria recurso por analogia.","O pedido de reconsideração não interrompe automaticamente prazo recursal.","A escolha da via depende da natureza do pronunciamento e do vício alegado; não basta chamar a petição de “recurso”."],"questions":[["Múltipla escolha","Qual alternativa descreve corretamente o recurso?",["Ação autônoma que sempre pressupõe trânsito em julgado.","Meio voluntário de impugnação no mesmo processo, previsto em lei.","Pedido informal que suspende prazos.","Instrumento exclusivo para decisões colegiadas."],"B","O recurso é meio de impugnação interno ao processo e depende de previsão legal."],["Múltipla escolha","O pedido de reconsideração, como regra:",["Interrompe o prazo recursal.","Substitui a apelação.","Não suspende nem interrompe o prazo do recurso cabível.","É recurso previsto no art. 994."],"C","A parte deve interpor o recurso adequado dentro do prazo legal, sem confiar em pedido de reconsideração."],["Discursiva","Diferencie error in judicando e error in procedendo.","Error in judicando é erro na solução de mérito ou na aplicação do direito; error in procedendo é vício procedimental ou formal que pode justificar invalidação da decisão.","",""],["Discursiva","Explique por que a ação rescisória não é recurso.","Porque inaugura processo autônomo para desconstituir decisão transitada em julgado, nas hipóteses taxativas do art. 966 do CPC.","",""]],"learning_map":"Pronunciamento judicial → identificação do vício → meio legal adequado → admissibilidade → julgamento → reforma, invalidação, integração ou manutenção","source_note":"Base normativa: Constituição Federal e CPC/2015. Síntese didática autoral orientada por Fredie Didier Jr., Leonardo Carneiro da Cunha, Teresa Arruda Alvim e Daniel Amorim Assumpção Neves."},{"title":"Pressupostos de admissibilidade, prazos e efeitos recursais","objective":"Dominar os requisitos intrínsecos e extrínsecos de admissibilidade, a contagem dos prazos, o preparo, a legitimidade, o interesse e os efeitos que a interposição pode produzir.","sections":[["1. Juízo de admissibilidade e juízo de mérito","O juízo de admissibilidade verifica se o recurso pode ser conhecido: cabimento, legitimidade, interesse, tempestividade, regularidade formal, inexistência de fato impeditivo ou extintivo e preparo, quando exigido. O juízo de mérito examina se a pretensão recursal procede. Recurso não conhecido não tem seu mérito examinado; recurso conhecido e desprovido é examinado, mas a pretensão é rejeitada."],["2. Cabimento, legitimidade e interesse","O recurso deve corresponder ao pronunciamento impugnado e à hipótese legal. Podem recorrer a parte vencida, o terceiro prejudicado e o Ministério Público, como parte ou fiscal da ordem jurídica (art. 996). O terceiro deve demonstrar possibilidade de a decisão atingir direito de que se afirma titular ou que possa defender como substituto processual. O interesse recursal exige utilidade e necessidade: a reforma pretendida deve melhorar a situação jurídica do recorrente."],["3. Tempestividade e contagem","O prazo recursal é, em regra, de 15 dias úteis; os embargos de declaração têm prazo de 5 dias úteis (arts. 1.003, § 5º, e 1.023). A contagem segue os arts. 219 e 224 do CPC: contam-se dias úteis nos prazos processuais em dias, excluindo o dia do começo e incluindo o do vencimento. Devem ser conferidos a intimação válida, feriados locais, suspensões, indisponibilidade do sistema e regras específicas. Ministério Público, Fazenda Pública e Defensoria Pública têm prazo em dobro nas hipóteses dos arts. 180, 183 e 186, ressalvadas exceções legais."],["4. Preparo, gratuidade e deserção","O preparo abrange custas recursais e, quando exigido, porte de remessa e retorno. A ausência ou insuficiência pode levar à deserção, mas o CPC prevê oportunidades de regularização: intimação para recolher em dobro quando não comprovado o preparo no ato de interposição (art. 1.007, § 4º) e complementação em caso de insuficiência (§ 2º). O beneficiário da gratuidade é dispensado nos limites legais. A aplicação exige observar o texto vigente e a situação concreta."],["5. Regularidade formal, dialeticidade e inovação","A petição deve observar forma, fundamentação e pedidos próprios do recurso. A dialeticidade exige enfrentar os fundamentos da decisão recorrida de maneira específica. Em regra, não se admite inovação recursal fática, pois a parte não deve reservar para o tribunal alegações e provas que poderiam ter sido apresentadas antes; há exceções legais, como fato superveniente e questões de ordem pública, observados contraditório e limites cognitivos."],["6. Desistência, renúncia e aquiescência","O recorrente pode desistir do recurso sem anuência do recorrido ou dos litisconsortes, nos termos do art. 998, ressalvadas as consequências sistêmicas previstas em lei para recursos repetitivos. Renúncia ao direito de recorrer e aceitação expressa ou tácita da decisão podem impedir o recurso (arts. 999 e 1.000). A aquiescência deve ser inequívoca e incompatível com a vontade de impugnar."],["7. Efeito devolutivo","O efeito devolutivo transfere ao órgão julgador o conhecimento da matéria impugnada, nos limites do pedido e dos capítulos recorridos, sem prejuízo de matérias que possam ser conhecidas de ofício. A extensão responde “o que foi devolvido”; a profundidade responde “com quais fundamentos e questões o tribunal pode examinar o capítulo impugnado”. O art. 1.013 disciplina a apelação e inclui hipóteses de julgamento imediato do mérito quando a causa estiver madura."],["8. Efeito suspensivo e eficácia da decisão","Pelo art. 995, os recursos não impedem automaticamente a eficácia da decisão, salvo previsão legal ou decisão judicial em sentido diverso. O efeito suspensivo impede, dentro de seus limites, a produção imediata dos efeitos da decisão. Quando não for automático, pode ser requerido ao tribunal ou relator conforme a espécie recursal, demonstrando risco de dano grave, de difícil ou impossível reparação e probabilidade de provimento (art. 995, parágrafo único). A apelação tem, como regra, efeito suspensivo, com exceções no art. 1.012, § 1º."],["9. Outros efeitos relevantes","O efeito translativo permite exame de matérias cognoscíveis de ofício dentro dos limites processuais aplicáveis. O efeito substitutivo (art. 1.008) faz com que o julgamento do tribunal substitua a decisão recorrida no que foi objeto do recurso, quando o mérito recursal é apreciado. O efeito expansivo pode atingir capítulos ou sujeitos relacionados em hipóteses legais. O efeito regressivo permite retratação pelo próprio órgão prolator quando a lei o prevê, como em hipóteses de apelação contra sentença de indeferimento da inicial ou improcedência liminar."],["10. Proibição da reformatio in pejus e sucumbência recíproca","Como regra, o recurso exclusivo de uma parte não deve piorar sua situação sem recurso da parte contrária, ressalvadas matérias de ordem pública e particularidades do sistema. Havendo sucumbência recíproca, ambas as partes podem recorrer, nos limites de seus interesses. O recurso adesivo é subordinado ao recurso independente e segue as regras do art. 997, §§ 1º e 2º."]],"comparisons":[["Admissibilidade","Examina se o recurso pode ser conhecido."],["Mérito recursal","Examina se a decisão deve ser reformada, invalidada, integrada ou esclarecida."],["Efeito devolutivo","Delimita a matéria que o tribunal poderá reapreciar."],["Efeito suspensivo","Impede temporariamente a eficácia da decisão nos limites da suspensão."],["Recurso adesivo","Forma subordinada de recorrer; depende da admissibilidade do recurso independente e da sucumbência recíproca."]],"legislation":["CPC, arts. 180, 183, 186, 219, 224, 995 a 1.008, 1.003, 1.007, 1.012, 1.013 e 997."],"cases":["O prazo geral recursal é de 15 dias úteis; embargos de declaração têm 5 dias úteis.","O preparo insuficiente e a falta de comprovação podem ter regimes de regularização diferentes, conforme art. 1.007.","O efeito suspensivo não é regra geral para todos os recursos.","A reformatio in pejus deve ser estudada em conjunto com matérias cognoscíveis de ofício e os limites objetivos do recurso."],"questions":[["Múltipla escolha","Qual é o prazo para embargos de declaração no CPC?",["5 dias úteis.","10 dias corridos.","15 dias úteis.","30 dias úteis."],"A","O art. 1.023 estabelece prazo de cinco dias, contado em dias úteis conforme o CPC."],["Múltipla escolha","Pelo art. 995, como regra, a interposição do recurso:",["Suspende sempre a decisão.","Não impede a eficácia da decisão, salvo previsão legal ou decisão judicial.","Extingue o processo.","Torna a decisão inexistente."],"B","O efeito suspensivo depende de previsão legal ou concessão judicial."],["Discursiva","Diferencie efeito devolutivo e suspensivo.","O devolutivo define a matéria submetida ao órgão recursal; o suspensivo impede a eficácia da decisão recorrida, total ou parcialmente, enquanto vigente.","",""],["Discursiva","Explique o interesse recursal.","É a utilidade e necessidade do recurso: a providência pretendida deve ser apta a proporcionar resultado juridicamente mais favorável ao recorrente.","",""]],"learning_map":"Admissibilidade → prazo e preparo → delimitação do objeto → efeitos → julgamento do mérito","source_note":"Base normativa: CPC/2015. Síntese autoral orientada por Didier Jr. e Cunha, Curso de Direito Processual Civil, v. 3; Neves, Manual de Direito Processual Civil; Bueno, Manual de Direito Processual Civil."},{"title":"Apelação e julgamento pelo tribunal","objective":"Identificar o cabimento da apelação, estruturar a petição recursal, compreender a devolutividade, as hipóteses de efeito suspensivo e a técnica da causa madura.","sections":[["1. Cabimento e função","A apelação é o recurso ordinário destinado, em regra, a impugnar sentença (art. 1.009). Sentença é o pronunciamento que, com fundamento nos arts. 485 ou 487, põe fim à fase cognitiva do procedimento comum ou extingue a execução, conforme art. 203, § 1º. O nome atribuído pelo juiz não é decisivo: importa a natureza e a função do pronunciamento no procedimento."],["2. Interposição e razões","A apelação é interposta por petição dirigida ao juízo de primeiro grau, que intima o apelado para contrarrazões e depois remete os autos ao tribunal, sem juízo de admissibilidade pelo juiz de origem no modelo do CPC/2015 (art. 1.010, §§ 1º a 3º). A petição deve conter identificação das partes, exposição do fato e do direito, razões de reforma ou nulidade e pedido de nova decisão. Razões genéricas podem violar a dialeticidade."],["3. Preliminares e mérito","O apelante pode suscitar nulidades e questões processuais antes do mérito, explicando o prejuízo e a consequência pretendida. Se pede anulação, deve indicar o vício e por que não é possível apenas reformar a decisão. Se pede reforma, deve demonstrar o erro na conclusão judicial e formular pedido compatível. O tribunal pode enfrentar questões suscitadas e discutidas no processo ainda que não solucionadas, nos limites do art. 1.013."],["4. Efeito suspensivo e exceções","A apelação tem, em regra, efeito suspensivo (art. 1.012, caput). O § 1º prevê exceções, como sentenças que homologam divisão ou demarcação, condenam a pagar alimentos, extinguem sem resolução do mérito ou julgam improcedentes embargos do executado, entre outras hipóteses legais. Nas situações sem efeito suspensivo automático, pode-se requerer sua atribuição ao tribunal ou relator, observando o art. 1.012, §§ 3º e 4º."],["5. Efeito devolutivo: extensão e profundidade","O tribunal aprecia a matéria impugnada e os fundamentos relacionados ao capítulo recorrido. O recurso parcial não devolve automaticamente todos os capítulos independentes da sentença. Dentro do capítulo impugnado, o tribunal pode analisar questões discutidas e fundamentos relevantes nos termos do art. 1.013, §§ 1º e 2º. É essencial delimitar pedidos e capítulos para evitar devolução excessiva ou insuficiente."],["6. Teoria da causa madura","O art. 1.013, § 3º, autoriza o tribunal, ao reformar sentença fundada no art. 485, a julgar desde logo o mérito quando o processo estiver em condições de imediato julgamento. A técnica também se aplica às hipóteses de omissão no exame de pedido e nulidade por falta de fundamentação, nos termos legais. Não é licença para suprimir prova necessária ou contraditório: a causa deve estar madura, com instrução suficiente."],["7. Fatos novos e questões de fato","Questões de fato não propostas no primeiro grau podem ser suscitadas na apelação apenas quando a parte provar força maior (art. 1.014). Fatos supervenientes podem ser considerados conforme art. 493, com contraditório. A apelação não deve servir para corrigir estratégia processual omissa sem justificativa legal."],["8. Contrarrazões e recurso adesivo","O apelado apresenta contrarrazões em 15 dias úteis, podendo responder aos fundamentos e suscitar questões processuais pertinentes. Havendo sucumbência recíproca, pode interpor recurso adesivo no prazo das contrarrazões, observados o art. 997 e os requisitos da espécie recursal. A adesão fica subordinada ao recurso independente."],["9. Apelação contra sentença terminativa","Quando a sentença extingue o processo sem resolução do mérito, o tribunal pode, em determinadas condições, julgar o mérito imediatamente. O art. 485, § 7º, também permite retratação pelo juiz em cinco dias em hipóteses de indeferimento da petição inicial e demais casos expressamente previstos no CPC. O cabimento da retratação depende da hipótese legal, não é regra universal para qualquer sentença."]],"comparisons":[["Apelação","Impugna sentença; em regra, é interposta no primeiro grau e julgada pelo tribunal."],["Agravo de instrumento","Impugna decisões interlocutórias nas hipóteses do art. 1.015 e em situações reconhecidas pela jurisprudência sobre taxatividade mitigada."],["Anulação","Busca desconstituir decisão por vício processual; pode haver retorno à origem se a causa não estiver madura."],["Reforma","Busca substituir a conclusão jurídica ou fática por outra solução, quando o tribunal puder julgar o mérito."]],"legislation":["CPC, arts. 203, § 1º, 485, § 7º, 487, 1.009 a 1.014; art. 1.012, §§ 1º, 3º e 4º; art. 997."],"cases":["O art. 1.009, § 1º, prevê que questões resolvidas na fase de conhecimento que não comportem agravo de instrumento não ficam cobertas pela preclusão imediata e devem ser suscitadas em preliminar de apelação ou contrarrazões.","Tema da taxatividade mitigada do art. 1.015: STJ, Tema Repetitivo 988, que admite agravo de instrumento quando houver urgência decorrente da inutilidade do exame apenas em apelação.","A causa madura depende de condições efetivas para julgamento imediato; não dispensa instrução necessária."],"questions":[["Múltipla escolha","A apelação é cabível, em regra, contra:",["Sentença.","Qualquer despacho.","Somente acórdão do STJ.","Apenas decisão interlocutória sobre prova."],"A","O art. 1.009 prevê apelação contra sentença."],["Múltipla escolha","A causa madura permite ao tribunal:",["Sempre reabrir a instrução.","Julgar desde logo o mérito quando presentes os requisitos legais e o processo estiver pronto.","Dispensar o contraditório em qualquer hipótese.","Criar pedido novo para a parte."],"B","A técnica do art. 1.013, § 3º, depende de causa em condições de imediato julgamento."],["Discursiva","Explique a diferença entre extensão e profundidade do efeito devolutivo.","A extensão delimita os capítulos impugnados; a profundidade define as questões e fundamentos que podem ser examinados dentro do objeto devolvido.","",""],["Discursiva","Quando a apelação não tem efeito suspensivo automático?","Nas hipóteses do art. 1.012, § 1º, sem prejuízo de requerimento de suspensão conforme os §§ 3º e 4º e os requisitos legais.","",""]],"learning_map":"Sentença → apelação → contrarrazões → remessa ao tribunal → julgamento → reforma, anulação ou causa madura","source_note":"Base normativa: CPC/2015. Doutrina: Didier Jr. e Cunha; Teresa Arruda Alvim, Os Agravos no CPC de 2015 (para distinções com interlocutórias); Cassio Scarpinella Bueno, Manual de Direito Processual Civil."},{"title":"Agravo de instrumento, agravo interno e embargos de declaração","objective":"Distinguir os três recursos, identificar seus cabimentos, requisitos, prazos, efeitos e técnicas de fundamentação, evitando erro de escolha e uso protelatório.","sections":[["1. Agravo de instrumento: cabimento","O agravo de instrumento impugna decisões interlocutórias nas hipóteses do art. 1.015 do CPC, incluindo tutelas provisórias, mérito do processo, convenção de arbitragem, incidente de desconsideração da personalidade jurídica, gratuidade da justiça, exibição ou posse de documento ou coisa, exclusão de litisconsorte, intervenção de terceiros e outras hipóteses legais. Também cabe em liquidação, cumprimento de sentença, execução e inventário (parágrafo único)."],["2. Taxatividade mitigada e urgência","No Tema 988, o STJ firmou a tese de taxatividade mitigada: admite-se agravo de instrumento quando houver urgência decorrente da inutilidade do exame da questão somente em apelação. Não é autorização para agravar de qualquer interlocutória. A parte deve demonstrar concretamente por que esperar a apelação tornaria ineficaz o controle judicial. Se não couber agravo imediato, aplica-se o art. 1.009, § 1º."],["3. Formação e processamento do agravo","O agravo é dirigido diretamente ao tribunal e deve observar o art. 1.016, com exposição dos fatos e do direito, razões, pedido e identificação dos advogados. O art. 1.017 disciplina peças obrigatórias e facultativas e prevê solução para autos eletrônicos. O relator pode atribuir efeito suspensivo ou antecipar tutela recursal quando preenchidos os requisitos do art. 1.019, I. O agravado é intimado para resposta."],["4. Agravo interno","O agravo interno, art. 1.021, impugna decisão monocrática proferida pelo relator para que o órgão colegiado competente a reexamine. Deve atacar especificamente os fundamentos da decisão, sob pena de inadmissibilidade. O relator pode retratar-se; se mantiver a decisão, leva o recurso ao colegiado. A multa do § 4º exige manifesta inadmissibilidade ou improcedência, votação unânime e fundamentação específica; não deve ser aplicada automaticamente por mero desprovimento."],["5. Embargos de declaração: hipóteses","Os embargos de declaração são cabíveis contra qualquer decisão judicial para esclarecer obscuridade, eliminar contradição, suprir omissão ou corrigir erro material (art. 1.022). Omissão inclui deixar de se pronunciar sobre tese firmada em julgamento de casos repetitivos ou incidente de assunção de competência aplicável, bem como incorrer nas hipóteses do art. 489, § 1º. Não servem, em regra, para simples rediscussão do mérito."],["6. Prazo, procedimento e efeitos dos embargos","O prazo é de cinco dias úteis, sem preparo (art. 1.023). O embargado será ouvido em cinco dias se o eventual acolhimento puder modificar a decisão. Os embargos interrompem o prazo para interposição de outros recursos para ambas as partes (art. 1.026), mas não têm efeito suspensivo automático. O juiz ou tribunal pode suspender a eficácia da decisão nas condições do § 1º."],["7. Efeitos modificativos e prequestionamento","Embargos podem excepcionalmente produzir efeitos modificativos quando a correção de omissão, contradição, obscuridade ou erro material conduzir necessariamente à alteração do resultado; deve-se respeitar o contraditório. Para prequestionamento, o art. 1.025 prevê que elementos suscitados pelo embargante podem considerar-se incluídos no acórdão se o tribunal superior reconhecer a existência de vício. Isso não dispensa fundamentação adequada nem garante conhecimento automático de REsp ou RE."],["8. Embargos protelatórios","A oposição manifestamente protelatória pode gerar multa de até 2% do valor atualizado da causa; na reiteração, a multa pode alcançar até 10%, conforme art. 1.026, §§ 2º e 3º. Há limites para novos embargos após reiteração. A sanção exige motivação concreta: embargos legítimos para sanar vício não se tornam protelatórios apenas porque são rejeitados."]],"comparisons":[["Agravo de instrumento","Contra decisões interlocutórias nas hipóteses do art. 1.015 e situações urgentes reconhecidas pela taxatividade mitigada."],["Agravo interno","Contra decisão monocrática do relator, para revisão pelo órgão colegiado."],["Embargos de declaração","Contra qualquer decisão judicial, para sanar omissão, contradição, obscuridade ou erro material."],["Prazos","Agravo de instrumento e interno: regra geral de 15 dias úteis; embargos de declaração: 5 dias úteis."]],"legislation":["CPC, arts. 1.015 a 1.020; 1.021; 1.022 a 1.026; art. 489, § 1º; art. 1.009, § 1º."],"cases":["STJ, Tema Repetitivo 988: taxatividade mitigada do rol do art. 1.015, com urgência decorrente da inutilidade do exame futuro.","O art. 1.021, § 4º, não autoriza multa automática por agravo interno desprovido; exige manifesta inadmissibilidade ou improcedência e votação unânime.","Embargos de declaração interrompem prazo recursal, mas não têm efeito suspensivo automático."],"questions":[["Múltipla escolha","Os embargos de declaração são cabíveis para:",["Reabrir toda a instrução em qualquer caso.","Sanar omissão, contradição, obscuridade ou erro material.","Substituir sempre a apelação.","Atacar apenas sentenças."],"B","As hipóteses estão no art. 1.022 do CPC."],["Múltipla escolha","O agravo interno é dirigido contra:",["Sentença de primeiro grau.","Decisão monocrática do relator.","Despacho sem conteúdo decisório.","Qualquer acórdão transitado em julgado."],"B","O art. 1.021 disciplina a impugnação de decisão do relator ao colegiado."],["Discursiva","Explique a taxatividade mitigada do art. 1.015.","Segundo o Tema 988 do STJ, admite-se agravo fora das hipóteses literais do rol quando houver urgência decorrente da inutilidade do exame apenas em apelação, com demonstração concreta.","",""],["Discursiva","Quando os embargos de declaração podem ter efeitos modificativos?","Quando a correção de um dos vícios do art. 1.022 conduz, como consequência, à alteração do resultado, observando-se o contraditório quando cabível.","",""]],"learning_map":"Interlocutória → agravo de instrumento quando cabível; decisão do relator → agravo interno; vício de integração → embargos de declaração","source_note":"Base normativa: CPC/2015 e STJ, Tema 988. Doutrina: Teresa Arruda Alvim, Os Agravos no CPC de 2015; Didier Jr. e Cunha; Neves."},{"title":"Recursos ordinário, especial e extraordinário","objective":"Compreender a função constitucional dos recursos dirigidos aos tribunais superiores, seus fundamentos vinculados, requisitos específicos, prequestionamento e limites cognitivos.","sections":[["1. Recursos ordinários e extraordinários","Recursos ordinários permitem, dentro dos limites legais, revisão mais ampla da decisão. Recursos extraordinários em sentido amplo — especialmente REsp e RE — têm fundamentação vinculada e destinam-se à interpretação uniforme do direito federal infraconstitucional e constitucional, respectivamente. Não são uma terceira instância para reexaminar livremente fatos e provas."],["2. Recurso ordinário constitucional","O recurso ordinário é cabível nas hipóteses constitucionais e legais, como decisões denegatórias de habeas corpus ou mandado de segurança originários de tribunais, conforme competência constitucional, e causas envolvendo Estados estrangeiros ou organismo internacional e município ou pessoa residente no Brasil, nas condições do art. 1.027 do CPC e da Constituição. A identificação correta da competência e da hipótese constitucional é essencial."],["3. Recurso especial: função e hipóteses","O recurso especial, dirigido ao STJ, protege a autoridade e uniformidade da legislação federal infraconstitucional nas hipóteses do art. 105, III, da Constituição: contrariar tratado ou lei federal ou negar-lhes vigência; julgar válido ato de governo local contestado em face de lei federal; ou dar à lei federal interpretação divergente da atribuída por outro tribunal. A alegação deve se enquadrar precisamente em hipótese constitucional."],["4. Recurso extraordinário: função e hipóteses","O recurso extraordinário, dirigido ao STF, tutela a Constituição nas hipóteses do art. 102, III, como contrariedade a dispositivo constitucional, declaração de inconstitucionalidade de tratado ou lei federal, validação de lei ou ato local contestado em face da Constituição e validação de lei local contestada em face de lei federal, nos termos constitucionais. Exige demonstração de repercussão geral da questão constitucional (art. 102, § 3º, da Constituição e CPC, arts. 1.035 e seguintes)."],["5. Prequestionamento","A questão federal ou constitucional deve ter sido debatida e decidida pelo tribunal de origem, observadas as regras jurisprudenciais de prequestionamento. Se o acórdão for omisso, a parte deve avaliar embargos de declaração. O art. 1.025 prevê prequestionamento ficto sob condições específicas; sua aplicação exige apontar no recurso especial a violação ao art. 1.022 e demonstrar o vício pertinente, conforme orientação do STJ."],["6. Vedação ao reexame de fatos e provas","REsp e RE não se prestam, em regra, ao simples reexame do conjunto fático-probatório (Súmulas 7/STJ e 279/STF). É necessário formular questão de direito a partir das premissas fáticas estabelecidas no acórdão recorrido. A revaloração jurídica de fatos já delineados pode ser distinta de nova apreciação probatória, mas exige rigor técnico na demonstração."],["7. Relevância da questão federal no recurso especial","A Emenda Constitucional 125/2022 introduziu o requisito da relevância das questões de direito federal infraconstitucional no recurso especial, com hipóteses constitucionais de relevância presumida. A aplicação prática depende da disciplina constitucional, legislativa e regimental vigente e das regras de transição pertinentes ao momento da interposição. Antes de protocolar, deve-se conferir a regulamentação atual e a orientação oficial do STJ."],["8. Requisitos formais e demonstração analítica","A petição deve indicar a hipótese constitucional, expor as razões de reforma ou invalidação e demonstrar de modo analítico a violação ou divergência. No dissídio jurisprudencial, é necessário comprovar a divergência e realizar cotejo analítico entre julgados com similitude fática e jurídica, conforme o CPC e o regimento do tribunal. Citações genéricas de artigos não bastam."],["9. Julgamento e precedentes qualificados","REsp e RE podem integrar sistemas de repercussão geral e recursos repetitivos, com seleção de casos representativos, suspensão de processos, julgamento de tese e aplicação aos casos semelhantes. O regime dos arts. 1.036 a 1.041 do CPC racionaliza a litigiosidade repetitiva e reforça isonomia e segurança jurídica. A parte deve verificar se a questão está afetada, julgada ou sobrestada."]],"comparisons":[["REsp","STJ; questão de direito federal infraconstitucional; hipóteses do art. 105, III, da Constituição."],["RE","STF; questão constitucional; hipóteses do art. 102, III, e repercussão geral."],["Recurso ordinário","Hipóteses constitucionais específicas e devolutividade ordinária, conforme o caso."],["Prequestionamento","Exige que a questão tenha sido debatida no tribunal de origem, com uso adequado de embargos quando houver omissão."],["Reexame de prova","Em regra vedado em REsp/RE; a questão deve ser jurídica e respeitar premissas fáticas do acórdão."]],"legislation":["Constituição Federal, arts. 102, III e § 3º, e 105, III; CPC, arts. 1.027 a 1.041; CPC, arts. 1.029 a 1.035; EC 125/2022."],"cases":["Súmula 7/STJ: a pretensão de simples reexame de prova não enseja recurso especial.","Súmula 279/STF: para simples reexame de prova não cabe recurso extraordinário.","STJ e STF mantêm sistemas oficiais de precedentes qualificados; conferir a situação atual do tema antes de interpor recurso.","A relevância da questão federal foi introduzida pela EC 125/2022; conferir disciplina vigente e aplicabilidade temporal antes de protocolar."],"questions":[["Múltipla escolha","O recurso especial é dirigido ao:",["STF para interpretar a Constituição.","STJ para hipóteses de direito federal infraconstitucional previstas na Constituição.","Juízo de primeiro grau para reexaminar prova.","CNJ."],"B","O art. 105, III, da Constituição define a competência do STJ para o recurso especial."],["Múltipla escolha","A repercussão geral é requisito constitucional do:",["Recurso extraordinário.","Agravo interno.","Embargo de declaração em primeiro grau.","Pedido de reconsideração."],"A","A repercussão geral é requisito do recurso extraordinário."],["Discursiva","Diferencie REsp e RE.","REsp trata das hipóteses constitucionais relativas à legislação federal infraconstitucional e é julgado pelo STJ; RE tutela questão constitucional e é julgado pelo STF.","",""],["Discursiva","Por que o prequestionamento é relevante?","Porque os tribunais superiores examinam questões previamente debatidas e decididas pelo tribunal de origem; omissões devem ser enfrentadas, em regra, por embargos de declaração.","",""]],"learning_map":"Acórdão recorrido → questão federal ou constitucional → prequestionamento → requisitos específicos → juízo de admissibilidade → tribunal superior","source_note":"Base normativa: Constituição, CPC e jurisprudência sumulada. Doutrina: Arruda Alvim e Bruno Dantas, Precedentes, Recurso Especial e Recurso Extraordinário; Didier Jr. e Cunha."},{"title":"Agravo em REsp/RE, embargos de divergência e precedentes qualificados","objective":"Entender a impugnação das decisões de inadmissibilidade de recursos excepcionais e a função uniformizadora dos precedentes, da repercussão geral e dos repetitivos.","sections":[["1. Agravo em recurso especial ou extraordinário","O agravo do art. 1.042 é cabível, em regra, contra decisão do presidente ou vice-presidente do tribunal de origem que inadmite REsp ou RE, ressalvadas hipóteses em que a decisão se funda na aplicação de entendimento firmado em repercussão geral ou repetitivos, caso em que o CPC prevê agravo interno na origem (art. 1.030, § 2º). A identificação do fundamento da decisão é decisiva para escolher o recurso."],["2. Impugnação específica dos fundamentos","O agravo deve enfrentar todos os fundamentos suficientes da decisão de inadmissibilidade. A mera repetição das razões do REsp ou RE, sem atacar o juízo negativo, pode levar ao não conhecimento. O recorrente deve identificar cada óbice, explicar por que não se aplica e demonstrar o atendimento dos requisitos de admissibilidade."],["3. Embargos de divergência","Os embargos de divergência, arts. 1.043 e 1.044, buscam uniformizar divergência interna no STF ou STJ, nas hipóteses legais, sobre interpretação do direito. Exigem cotejo analítico e demonstração da similitude entre o acórdão embargado e o paradigma. Não se destinam a rediscutir qualquer erro nem a criar nova instância ampla de revisão."],["4. Repercussão geral","No recurso extraordinário, o STF avalia se a questão constitucional tem relevância econômica, política, social ou jurídica que ultrapasse os interesses subjetivos da causa. Reconhecida a repercussão geral, podem ser suspensos processos e aplicada a tese aos casos semelhantes, conforme os arts. 1.035 e seguintes. O tribunal de origem realiza juízo de conformação conforme o CPC."],["5. Recursos especiais repetitivos","Havendo multiplicidade de recursos com idêntica questão de direito federal, selecionam-se recursos representativos para julgamento, com possível suspensão dos demais. A tese firmada orienta a solução de casos semelhantes, conforme arts. 1.036 a 1.041. A técnica promove uniformidade, isonomia e eficiência, mas exige delimitação precisa da questão afetada e aplicação coerente ao caso concreto."],["6. IRDR e incidente de assunção de competência","O incidente de resolução de demandas repetitivas (arts. 976 a 987) permite fixar tese jurídica sobre questão unicamente de direito repetida em múltiplos processos, com risco à isonomia e à segurança jurídica. A assunção de competência (art. 947) permite julgamento por órgão indicado no regimento quando houver relevante questão de direito com grande repercussão social, sem repetição em múltiplos processos. Ambos dialogam com o sistema de precedentes, mas têm pressupostos distintos."],["7. Reclamação e observância de precedentes","A reclamação (arts. 988 a 993) pode preservar competência, garantir autoridade de decisões e, nas hipóteses legais, assegurar observância de súmulas vinculantes, decisões do STF em controle concentrado e acórdãos em IRDR ou IAC. Seu cabimento é estrito; não é sucedâneo recursal e observa limites como o trânsito em julgado e a estrutura de precedentes qualificados previstos em lei."],["8. Técnica de aplicação e distinção","A decisão judicial deve identificar a ratio decidendi do precedente, verificar similitude fática e jurídica e justificar sua aplicação. Se houver distinção relevante, o julgador pode afastar a tese para aquele caso mediante fundamentação adequada (distinguishing). Superação do precedente (overruling) exige justificação institucional, atenção à segurança jurídica e, quando cabível, modulação de efeitos. O art. 489, § 1º, e os arts. 926 e 927 estruturam esse dever de fundamentação."]],"comparisons":[["Agravo do art. 1.042","Combate inadmissão de REsp/RE pela origem, salvo hipótese em que o CPC determine agravo interno."],["Agravo interno do art. 1.030, § 2º","Impugna decisão que aplica precedente de repercussão geral ou repetitivo para negar seguimento, na hipótese legal."],["Repercussão geral","Técnica do STF para selecionar questão constitucional com relevância que transcende as partes."],["Recurso repetitivo","Técnica de julgamento de múltiplos REsp/RE com idêntica questão de direito."],["IRDR x IAC","IRDR pressupõe repetição de processos e risco à isonomia/segurança; IAC envolve questão relevante de direito com grande repercussão social sem repetição múltipla."]],"legislation":["CPC, arts. 926 a 928, 947, 976 a 987, 988 a 993, 1.029 a 1.044; Constituição, arts. 102 e 105."],"cases":["O STJ disponibiliza portal oficial de recursos repetitivos e IACs, com temas, processos afetados e teses.","A decisão que aplica precedente repetitivo ou repercussão geral pode ter via impugnativa diferente daquela que inadmite recurso por outros óbices.","A reclamação não substitui recurso cabível nem pode ser usada fora das hipóteses legais."],"questions":[["Múltipla escolha","Quando a decisão de origem aplica precedente repetitivo para negar seguimento a REsp/RE, a impugnação prevista em lei é, em regra:",["Agravo interno na origem, nos termos do art. 1.030, § 2º.","Ação rescisória imediata.","Embargos de divergência no juízo de primeiro grau.","Pedido de reconsideração obrigatório."],"A","O art. 1.030, § 2º, prevê agravo interno para a hipótese descrita."],["Múltipla escolha","O IRDR exige, entre outros pressupostos:",["Repetição efetiva de processos com controvérsia sobre questão unicamente de direito e risco à isonomia e segurança jurídica.","Trânsito em julgado de todos os processos.","Questão exclusivamente probatória.","Ausência de multiplicidade de demandas."],"A","Esses são os pressupostos do art. 976 do CPC."],["Discursiva","Diferencie distinguishing e overruling.","Distinguishing afasta a aplicação de precedente por diferença juridicamente relevante do caso; overruling é a superação do entendimento anteriormente adotado.","",""],["Discursiva","Qual é a função dos embargos de divergência?","Uniformizar a jurisprudência interna do tribunal superior quando configurada divergência nos termos legais, mediante cotejo analítico entre julgados.","",""]],"learning_map":"Inadmissão de recurso excepcional → identificação do fundamento → agravo cabível → julgamento superior; questão repetitiva → afetação → tese → aplicação aos casos","source_note":"Base normativa: CPC/2015. Doutrina: Arruda Alvim e Bruno Dantas; Didier Jr. e Cunha; Daniel Mitidiero, Precedentes: da persuasão à vinculação."},{"title":"Ação rescisória, reclamação, mandado de segurança e outros meios autônomos","objective":"Distinguir as ações e medidas que podem impugnar decisões judiciais fora do sistema recursal, reconhecendo seus pressupostos, limites e riscos de utilização inadequada.","sections":[["1. Ação rescisória e coisa julgada","A ação rescisória busca desconstituir decisão de mérito transitada em julgado nas hipóteses taxativas do art. 966 do CPC. Não é recurso e não funciona como nova apelação. Entre os fundamentos estão corrupção ou concussão do juiz, impedimento ou incompetência absoluta, dolo ou coação, simulação ou colusão, violação manifesta de norma jurídica, prova falsa, prova nova e erro de fato nas condições legais. O pedido pode envolver juízo rescindente e, quando cabível, juízo rescisório."],["2. Prazo e competência da rescisória","O prazo decadencial é, em regra, de dois anos contados do trânsito em julgado da última decisão proferida no processo (art. 975), com regras específicas para prova nova e outras situações. A competência é originária do tribunal competente, conforme a decisão que se pretende rescindir. A petição deve cumprir os requisitos legais, incluir depósito de 5% do valor da causa, quando exigível, e observar as exceções do art. 968."],["3. Querela nullitatis","A querela nullitatis é construção doutrinária e jurisprudencial utilizada em situações excepcionais de inexistência ou nulidade transrescisória, especialmente vício gravíssimo de citação que impede a formação válida da relação processual em relação ao réu revel. Não é via genérica para corrigir injustiça, reabrir prova ou contornar o prazo da rescisória. O cabimento e a competência dependem do vício concreto e da orientação jurisprudencial aplicável."],["4. Reclamação constitucional e processual","A reclamação tem hipóteses taxativas no art. 988: preservar competência do tribunal, garantir autoridade de suas decisões e assegurar observância de determinadas decisões e precedentes qualificados. O CPC estabelece limites de cabimento, incluindo restrições após o trânsito em julgado e exigências específicas para precedentes. Não substitui recurso nem autoriza reexaminar livremente o mérito de decisões judiciais."],["5. Mandado de segurança contra ato judicial","O mandado de segurança contra ato judicial é excepcional. Em regra, não cabe quando existe recurso próprio apto a impugnar a decisão, à luz da Lei 12.016/2009 e da jurisprudência. A análise considera ilegalidade ou abuso manifesta, teratologia em situações reconhecidas e inexistência de meio recursal eficaz, sem converter a ação constitucional em sucedâneo recursal. O prazo decadencial geral é de 120 dias da ciência do ato impugnado, nos termos da lei."],["6. Impugnação ao cumprimento de sentença e embargos à execução","Não são recursos contra a decisão que se pretende revisar, mas meios de defesa incidentais ou autônomos na fase executiva. A impugnação ao cumprimento de sentença está nos arts. 525 e seguintes e permite alegar matérias legalmente previstas, como inexequibilidade do título, excesso de execução e causas modificativas ou extintivas supervenientes. Os embargos à execução, arts. 914 e seguintes, constituem ação de conhecimento incidental do executado, com fundamentos próprios."],["7. Correição parcial e pedido de reconsideração","A correição parcial é instrumento de matriz regimental, sujeito às normas locais e de organização judiciária, destinado a corrigir inversão tumultuária do procedimento quando não houver recurso próprio, sem funcionar como recurso geral de mérito. O pedido de reconsideração é requerimento informal ao próprio julgador, sem natureza recursal e, em regra, sem suspensão ou interrupção de prazo."],["8. Escolha do instrumento e vedação de sucedâneo","Antes de escolher meio autônomo, identifique: houve trânsito em julgado? O vício é rescindente, transrescisório ou mera discordância? Existe recurso próprio? Qual tribunal tem competência? Há prazo decadencial? O instrumento pedido pode efetivamente produzir o resultado pretendido? A escolha errada pode gerar inadmissibilidade, decadência ou uso abusivo do processo."]],"comparisons":[["Ação rescisória","Desconstitui decisão transitada em julgado nas hipóteses do art. 966; prazo geral de dois anos."],["Reclamação","Protege competência, autoridade e observância de precedentes qualificados nas hipóteses legais."],["Mandado de segurança contra ato judicial","Excepcional; não substitui recurso próprio e tem prazo decadencial geral de 120 dias."],["Querela nullitatis","Via excepcional para vícios transrescisórios, como falta de citação em condições juridicamente relevantes."],["Impugnação/embargos executivos","Meios de defesa na execução ou cumprimento de sentença, com fundamentos e procedimentos próprios."]],"legislation":["CPC, arts. 525, 914 a 920, 966 a 975, 988 a 993; Lei 12.016/2009, especialmente arts. 5º, II, e 23."],"cases":["O art. 966 traz hipóteses taxativas para ação rescisória; mera injustiça alegada não basta.","O art. 975 prevê prazo decadencial geral de dois anos, sujeito a regras específicas.","A reclamação não pode ser usada como sucedâneo recursal e tem limitações legais expressas.","O mandado de segurança contra ato judicial deve ser analisado excepcionalmente, especialmente quando há recurso próprio."],"questions":[["Múltipla escolha","A ação rescisória tem por objeto, em regra:",["Reexaminar qualquer decisão ainda recorrível.","Desconstituir decisão transitada em julgado em hipótese do art. 966.","Substituir os embargos de declaração.","Suspender automaticamente toda execução."],"B","A rescisória é ação autônoma restrita às hipóteses legais."],["Múltipla escolha","O prazo geral para impetração de mandado de segurança é de:",["15 dias úteis.","30 dias corridos.","120 dias da ciência do ato impugnado.","Dois anos em todos os casos."],"C","O art. 23 da Lei 12.016/2009 prevê 120 dias."],["Discursiva","Diferencie reclamação e ação rescisória.","A reclamação protege competência, autoridade e observância de precedentes nas hipóteses legais; a rescisória desconstitui decisão transitada em julgado com fundamento no art. 966 do CPC.","",""],["Discursiva","Por que o mandado de segurança não pode ser usado como sucedâneo recursal?","Porque a existência de recurso próprio eficaz, em regra, impede a utilização do mandado de segurança como substituto, preservando o sistema legal de impugnação e seus prazos.","",""]],"learning_map":"Trânsito em julgado → hipótese rescisória? → ação rescisória; vício transrescisório → querela excepcional; precedente/competência → reclamação","source_note":"Base normativa: CPC/2015 e Lei 12.016/2009. Doutrina: Didier Jr. e Cunha; Teresa Arruda Alvim; Daniel Amorim Assumpção Neves."},{"title":"Remessa necessária, técnicas de julgamento e prática recursal","objective":"Integrar o sistema recursal com a remessa necessária, o julgamento colegiado, a fundamentação, a estratégia de elaboração de recursos e a análise de casos concretos.","sections":[["1. Remessa necessária","A remessa necessária, também chamada reexame necessário, não é recurso: não depende de vontade recursal da Fazenda Pública e funciona como condição legal de eficácia de certas sentenças. O art. 496 disciplina hipóteses de sentenças contra a União, Estados, Distrito Federal, Municípios e respectivas autarquias e fundações públicas, além de embargos à execução fiscal, com limites de valor e exceções legais. A incidência deve ser conferida à luz do texto legal e dos precedentes aplicáveis."],["2. Sustentação oral e julgamento colegiado","A sustentação oral é admitida nas hipóteses legais e regimentais, incluindo determinados recursos e ações, nos termos do art. 937 do CPC e regras específicas. A parte deve observar inscrição, tempo, modalidade presencial ou virtual e regimento do tribunal. A sustentação não substitui razões escritas adequadas e deve concentrar-se nos pontos decisivos do caso."],["3. Ordem de julgamento e fundamentação","O julgamento recursal deve enfrentar os argumentos capazes de infirmar a conclusão adotada, conforme art. 489, § 1º, aplicado às decisões judiciais e integrado pelos deveres de fundamentação. O tribunal deve respeitar contraditório, não surpresa e limites da devolução. A técnica decisória envolve delimitar questão, norma, precedente, distinções e consequência jurídica."],["4. Honorários recursais","O art. 85, § 11, prevê majoração de honorários advocatícios em grau recursal, observados os requisitos definidos pela lei e pela jurisprudência. Não é consequência automática de qualquer recurso desprovido: exige análise da existência de honorários anteriormente fixados, trabalho adicional e limites legais, sem ultrapassar os tetos aplicáveis."],["5. Estratégia de elaboração de recurso","A peça deve começar pelo cabimento e tempestividade; identificar o capítulo recorrido; separar preliminares de mérito; impugnar especificamente os fundamentos; relacionar cada erro ao pedido; verificar preparo, representação e documentos; e conferir precedentes aplicáveis. Em recursos excepcionais, acrescente hipótese constitucional, prequestionamento, repercussão geral ou relevância quando exigível e cotejo analítico em caso de divergência."],["6. Matriz prática para análise de decisão","Leia o dispositivo e a fundamentação; classifique o pronunciamento como sentença, decisão interlocutória ou acórdão; determine se houve trânsito em julgado; identifique a matéria impugnada e o resultado pretendido; selecione o instrumento; calcule o prazo em dias úteis; confira preparo e legitimidade; avalie efeitos e pedido urgente; e documente os fundamentos de fato e de direito."],["7. Ética, boa-fé e responsabilidade processual","O direito de recorrer deve ser exercido com lealdade e finalidade processual legítima. Recursos manifestamente protelatórios podem gerar sanções previstas no CPC. A advocacia técnica deve evitar distorcer precedentes, omitir contexto relevante ou multiplicar impugnações incompatíveis. O objetivo é obter revisão juridicamente fundamentada, não apenas atrasar a eficácia da decisão."],["8. Roteiro final de revisão","Para cada decisão, responda: (a) qual é a natureza do pronunciamento? (b) qual instrumento cabe? (c) qual o prazo e termo inicial? (d) há preparo ou gratuidade? (e) quais fundamentos precisam ser impugnados? (f) qual efeito se pretende? (g) existe precedente vinculante? (h) qual pedido é coerente com o vício? (i) há risco de inovação, preclusão ou sanção?"]],"comparisons":[["Recurso","Voluntário, previsto em lei e interposto para impugnar decisão no mesmo processo."],["Remessa necessária","Reexame obrigatório em hipóteses legais; não é recurso e não depende de iniciativa da Fazenda."],["Honorários recursais","Possível majoração em grau recursal, conforme art. 85, § 11, e requisitos jurisprudenciais."],["Fundamentação recursal eficaz","Ataca os fundamentos determinantes, delimita o objeto e formula pedido compatível com o vício."]],"legislation":["CPC, arts. 85, § 11, 489, § 1º, 496, 937, 994 a 1.044; Constituição Federal, arts. 5º, LIV e LV."],"cases":["A remessa necessária não é recurso, pois não depende de iniciativa voluntária da parte.","Honorários recursais dependem dos requisitos legais e jurisprudenciais; não são automáticos em todo recurso desprovido.","A sustentação oral depende das hipóteses legais e do regimento do tribunal."],"questions":[["Múltipla escolha","A remessa necessária:",["É recurso previsto no art. 994.","Depende de manifestação voluntária do ente público.","É condição legal de eficácia de determinadas sentenças e não é recurso.","Cabe contra toda sentença sem exceção."],"C","A remessa necessária é reexame obrigatório nas hipóteses do art. 496."],["Múltipla escolha","A fundamentação recursal deve:",["Repetir genericamente a petição inicial.","Impugnar os fundamentos da decisão e formular pedido compatível com o vício.","Omitir o pedido para o tribunal decidir livremente.","Dispensar análise de prazo."],"B","A dialeticidade exige impugnação específica e pedido adequado."],["Discursiva","Elabore um checklist básico antes de interpor recurso.","Identificar natureza da decisão e cabimento; conferir legitimidade, interesse, prazo, preparo, regularidade formal, fundamentos, pedido, efeitos, precedentes e eventuais riscos de preclusão.","",""],["Discursiva","Explique por que remessa necessária não é recurso.","Porque decorre de previsão legal de reexame obrigatório de certas sentenças e não de manifestação voluntária de parte legitimada para recorrer.","",""]],"learning_map":"Decisão → classificação → cabimento → prazo/preparo → fundamentos → pedido → efeitos → protocolo e acompanhamento","source_note":"Base normativa: CPC/2015 e jurisprudência dos tribunais superiores. Doutrina: Didier Jr. e Cunha; Neves; Scarpinella Bueno."}];



function resourceModuleHtml(m,i,progress){
 const key='r'+(i+1); const done=!!progress[key];
 const paras=m.sections.map((sec,j)=>`<section class="chapter"><h4>${sec[0]}</h4><div class="illustrated-text"><span class="legal-doodle" aria-hidden="true">${legalDoodle((i+j)%4)}</span><p class="editable-legal" data-edit-key="resources-${i}-section-${j}">${sec[1]}</p></div></section>`).join('');
 const comp=`<div class="comparison-grid">${m.comparisons.map(c=>`<div class="comparison-item"><strong>${c[0]}</strong><p>${c[1]}</p></div>`).join('')}</div>`;
 const law=`<section class="chapter"><h4>Legislação essencial</h4><ul>${m.legislation.map(x=>`<li>${x}</li>`).join('')}</ul></section>`;
 const cases=`<section class="chapter"><h4>Jurisprudência e pontos de atenção</h4><ul>${m.cases.map(x=>`<li>${x}</li>`).join('')}</ul></section>`;
 const qs=`<section class="chapter"><h4>Exercícios autorais de fixação (${m.questions.length}) · <a href="https://oab.fgv.br/" target="_blank" rel="noopener">Provas OAB/FGV ↗</a></h4>${m.questions.map((q,j)=>`<details class="question"><summary>${j+1}. ${q[0]} — ${q[1]}</summary>${Array.isArray(q[2])?`<ol type="A">${q[2].map(o=>`<li>${o}</li>`).join('')}</ol>`:''}<details class="answer"><summary>Conferir resposta</summary><p><strong>${Array.isArray(q[2])?'Gabarito: '+q[3]:'Resposta esperada'}</strong></p><p>${Array.isArray(q[2])?q[4]:q[2]}</p></details></details>`).join('')}</section>`;
 return `<details class="guide-module" id="resources-module-${i+1}" ${i===0?'open':''}><summary><span class="module-number">${String(i+1).padStart(2,'0')}</span><span class="module-title">${m.title}</span><span class="done-label">${done?'Concluído':'Estudar'}</span></summary><div class="module-body"><div class="reader-tools"><button type="button" class="primary" data-edit-toggle="${i}">✎ Editar textos</button><button type="button" data-mark-color="gold">Grifar ouro</button><button type="button" data-mark-color="green">Grifar verde</button><button type="button" data-mark-color="sand">Grifar areia</button><button type="button" data-bookmark-add="${i}">🔖 Marcar seleção</button><span class="reader-hint">Selecione um trecho antes de grifar ou marcar.</span></div><p class="objective"><strong>Objetivo de aprendizagem:</strong> ${m.objective}</p>${paras}<section class="chapter"><h4>Mapa conceitual do módulo</h4><div class="learning-map">${m.learning_map.split(' → ').map(x=>`<span>${x}</span>`).join(`<b aria-hidden="true">→</b>`)}</div><p class="source-foot">${m.source_note}</p></section><section class="chapter"><h4>Quadro de distinções importantes</h4>${comp}</section>${law}${cases}${qs}<label class="completion"><input type="checkbox" data-module-done="${key}" ${done?'checked':''}> Marcar módulo como estudado</label></div></details>`;
}

  if(tabName==='Conteúdo') return `<div class="admin-guide"><div class="guide-intro"><p><strong>Material de estudo aprofundado · 6º período</strong></p><p>Programa organizado em oito módulos, partindo da teoria geral até os recursos em espécie, os meios autônomos de impugnação e a prática recursal. A exposição combina o CPC/2015, a Constituição Federal, doutrina processual civil e orientação jurisprudencial dos tribunais superiores. Os textos são sínteses autorais para estudo, não transcrições de obras.</p><div class="guide-progress"><span>Progresso de leitura: ${completed} de ${resourceModules.length} módulos</span><div class="progress-track"><i style="width:${completed/resourceModules.length*100}%"></i></div></div></div><details class="guide-module" open><summary><span class="module-title">Ementa programática completa</span></summary><div class="module-body"><p>Teoria geral dos meios de impugnação das decisões judiciais. Sistema recursal no CPC/2015. Conceito, natureza jurídica, finalidade, princípios e classificação dos recursos. Taxatividade, singularidade, fungibilidade, dialeticidade, voluntariedade, proibição da reformatio in pejus e primazia do julgamento do mérito. Pressupostos intrínsecos e extrínsecos de admissibilidade. Legitimidade, interesse, cabimento, tempestividade, preparo, regularidade formal, desistência, renúncia e aquiescência. Prazos recursais e contagem em dias úteis. Efeitos devolutivo, suspensivo, translativo, substitutivo, expansivo e regressivo. Apelação: cabimento, procedimento, contrarrazões, efeito suspensivo, devolutividade e teoria da causa madura. Agravo de instrumento: hipóteses legais, taxatividade mitigada, formação e tutela recursal. Agravo interno. Embargos de declaração: vícios, efeitos, prequestionamento e caráter protelatório. Recurso ordinário constitucional. Recurso especial e recurso extraordinário: hipóteses constitucionais, prequestionamento, repercussão geral, relevância da questão federal, cotejo analítico e limites cognitivos. Agravo em recurso especial e extraordinário. Embargos de divergência. Julgamento de recursos repetitivos, repercussão geral, IRDR e IAC. Sistema de precedentes obrigatórios, fundamentação, distinção e superação. Remessa necessária. Ação rescisória, reclamação, mandado de segurança contra ato judicial, querela nullitatis, correição parcial, pedido de reconsideração, impugnação ao cumprimento de sentença e embargos à execução. Estratégia de elaboração recursal, ética, boa-fé e análise de casos práticos.</p><p><strong>Objetivo geral:</strong> capacitar o estudante a identificar o instrumento adequado para impugnar cada pronunciamento judicial, avaliar cabimento, prazo, requisitos e efeitos, construir fundamentação recursal tecnicamente adequada e distinguir recursos de ações autônomas e outros mecanismos de controle.</p><p><strong>Metodologia:</strong> estudo sistemático do CPC e da Constituição, leitura orientada de doutrina, análise de precedentes oficiais, quadros comparativos, mapas conceituais e questões autorais com respostas comentadas.</p></div></details><h3 class="unit-heading">UNIDADE I · TEORIA GERAL E RECURSOS ORDINÁRIOS</h3>${resourceModules.slice(0,4).map((m,i)=>resourceModuleHtml(m,i,progress)).join('')}<h3 class="unit-heading">UNIDADE II · TRIBUNAIS SUPERIORES E OUTROS MEIOS DE IMPUGNAÇÃO</h3>${resourceModules.slice(4).map((m,i)=>resourceModuleHtml(m,i+4,progress)).join('')}<p class="legal-note"><strong>Nota de atualização:</strong> confira sempre a redação vigente do CPC, a Constituição, os regimentos internos e os precedentes oficiais aplicáveis. Prazos e cabimento devem ser conferidos à luz da intimação e das particularidades do caso concreto.</p></div>`;
  if(tabName==='Legislação') return `<div class="admin-guide"><p>Leitura sistemática da fonte primária. Abra os dispositivos diretamente no texto oficial e leia os artigos indicados em conjunto com os precedentes aplicáveis.</p><details class="guide-module" open><summary>Constituição Federal</summary><ul><li>Art. 5º, XXXV, LIV e LV: acesso à justiça, devido processo legal, contraditório e ampla defesa.</li><li>Art. 93, IX: fundamentação das decisões judiciais.</li><li>Art. 102, III e § 3º: recurso extraordinário e repercussão geral.</li><li>Art. 105, III: recurso especial.</li></ul><p><a href="https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm" target="_blank" rel="noopener">Constituição Federal — texto oficial ↗</a></p></details><details class="guide-module"><summary>CPC — teoria geral e recursos em espécie</summary><ul><li>Arts. 994 a 1.008: disposições gerais, admissibilidade e efeitos.</li><li>Arts. 1.009 a 1.014: apelação.</li><li>Arts. 1.015 a 1.020: agravo de instrumento.</li><li>Art. 1.021: agravo interno.</li><li>Arts. 1.022 a 1.026: embargos de declaração.</li><li>Arts. 1.027 a 1.044: recursos aos tribunais superiores e embargos de divergência.</li></ul><p><a href="https://www2.camara.leg.br/legin/fed/lei/2015/lei-13105-16-marco-2015-780273-normaatualizada-pl.html" target="_blank" rel="noopener">CPC/2015 — texto atualizado da Câmara dos Deputados ↗</a></p></details><details class="guide-module"><summary>CPC — precedentes e impugnações autônomas</summary><ul><li>Arts. 489, § 1º, e 926 a 928: fundamentação e precedentes.</li><li>Arts. 947 e 976 a 987: IAC e IRDR.</li><li>Arts. 966 a 975: ação rescisória.</li><li>Arts. 988 a 993: reclamação.</li><li>Arts. 1.035 a 1.041: repercussão geral e recursos repetitivos.</li></ul></details><details class="guide-module"><summary>Legislação complementar</summary><ul><li>Lei 12.016/2009: mandado de segurança.</li><li>Emenda Constitucional 125/2022: relevância da questão federal no recurso especial.</li><li>Regimentos internos do STF, STJ e do tribunal competente para a hipótese concreta.</li></ul></details></div>`;
  if(tabName==='Doutrina') return `<div class="admin-guide"><div class="guide-intro"><h3>Referências doutrinárias orientadoras</h3><p>O conteúdo apresenta sínteses autorais e remissões temáticas. Para estudo aprofundado, consulte as edições disponíveis na biblioteca e confira a paginação da edição efetivamente utilizada.</p></div><div class="doctrine-table"><table><thead><tr><th>Obra</th><th>Temas para leitura</th></tr></thead><tbody><tr><td>DIDIER JR., Fredie; CUNHA, Leonardo Carneiro da. <em>Curso de Direito Processual Civil, v. 3: Meios de Impugnação às Decisões Judiciais e Processo nos Tribunais</em>.</td><td>Teoria geral dos recursos, admissibilidade, efeitos, recursos em espécie e processo nos tribunais.</td></tr><tr><td>ALVIM, Teresa Arruda. <em>Os Agravos no CPC de 2015</em>.</td><td>Agravo de instrumento, decisões interlocutórias e técnica recursal.</td></tr><tr><td>ALVIM, Teresa Arruda; DANTAS, Bruno. <em>Precedentes, Recurso Especial e Recurso Extraordinário</em>.</td><td>Precedentes qualificados, recursos excepcionais e uniformização.</td></tr><tr><td>NEVES, Daniel Amorim Assumpção. <em>Manual de Direito Processual Civil</em>.</td><td>Visão sistemática do CPC, prazos, recursos e impugnações autônomas.</td></tr><tr><td>BUENO, Cassio Scarpinella. <em>Manual de Direito Processual Civil</em> e <em>Curso Sistematizado de Direito Processual Civil</em>.</td><td>Procedimento recursal, efeitos, apelação, agravos e tribunais superiores.</td></tr><tr><td>THEODORO JÚNIOR, Humberto. <em>Curso de Direito Processual Civil</em>.</td><td>Teoria geral, sistema recursal e processo nos tribunais.</td></tr></tbody></table></div><p class="legal-note">As referências indicam bibliografia de consulta; não atribuem citações literais ou páginas específicas. Utilize a edição disponível e confronte a doutrina com o CPC e a jurisprudência atual.</p></div>`;
  if(tabName==='Jurisprudência') return `<div class="admin-guide"><p>Jurisprudência de referência para pesquisa. Leia a tese e o inteiro teor, confirme a vigência e verifique se os fatos do precedente são comparáveis ao caso estudado.</p><details class="guide-module" open><summary>STJ — Tema Repetitivo 988: agravo de instrumento</summary><p>Tese da taxatividade mitigada do art. 1.015: admite-se agravo de instrumento quando houver urgência decorrente da inutilidade do julgamento da questão em apelação. A urgência deve ser demonstrada concretamente.</p><p><a href="https://www.stj.jus.br/sites/portalp/Processos/Repetitivos-e-IACs/Saiba-mais" target="_blank" rel="noopener">Portal de repetitivos e IACs do STJ ↗</a></p></details><details class="guide-module"><summary>Súmula 7/STJ e Súmula 279/STF</summary><p>Em regra, vedam o simples reexame de fatos e provas no recurso especial e no extraordinário, respectivamente. A fundamentação deve formular questão jurídica a partir das premissas estabelecidas no acórdão recorrido.</p></details><details class="guide-module"><summary>Repercussão geral e recursos repetitivos</summary><p>Consulte os temas no portal oficial do STF e do STJ, verificando situação processual, tese fixada, modulação, trânsito em julgado e decisões posteriores.</p><p><a href="https://processo.stj.jus.br/repetitivos/temas_repetitivos/pesquisa.jsp" target="_blank" rel="noopener">STJ — pesquisa de temas repetitivos ↗</a></p></details><details class="guide-module"><summary>Precedentes obrigatórios e reclamação</summary><p>Estude em conjunto os arts. 926 a 928 e 988 a 993 do CPC, com atenção aos limites da reclamação e à diferença entre aplicação, distinção e superação de precedentes.</p></details></div>`;
  if(tabName==='Questões') return `<div class="admin-guide"><p><strong>Questões autorais de revisão; não são transcrições de provas oficiais.</strong> Resolva primeiro e abra o gabarito comentado. Para questões reais, consulte cadernos e gabaritos originais da banca.</p>${resourceModules.map((m,i)=>`<details class="guide-module"><summary>Módulo ${i+1} — ${m.title} (${m.questions.length} questões)</summary>${m.questions.map((q,j)=>`<details class="question"><summary>${j+1}. ${escHtml(q[0])}: ${escHtml(q[1])}</summary>${Array.isArray(q[2])?`<ol type="A">${q[2].map(o=>`<li>${escHtml(o)}</li>`).join('')}</ol>`:''}<details class="answer"><summary>Ver resposta comentada</summary><p><strong>${q[2]&&Array.isArray(q[2])?'Gabarito: '+q[3]:'Resposta esperada'}</strong></p><p>${escHtml(q[2]&&Array.isArray(q[2])?q[4]:q[2])}</p></details></details>`).join('')}</details>`).join('')}</div>`;
  if(tabName==='Bibliografia') return `<div class="admin-guide"><h3>Bibliografia básica</h3><ul><li>DIDIER JR., Fredie; CUNHA, Leonardo Carneiro da. <em>Curso de Direito Processual Civil, v. 3: Meios de Impugnação às Decisões Judiciais e Processo nos Tribunais</em>. Juspodivm. Conferir edição disponível.</li><li>NEVES, Daniel Amorim Assumpção. <em>Manual de Direito Processual Civil</em>. Método. Conferir edição vigente.</li><li>BUENO, Cassio Scarpinella. <em>Manual de Direito Processual Civil</em>. Saraiva. Conferir edição vigente.</li></ul><h3>Bibliografia complementar</h3><ul><li>ALVIM, Teresa Arruda. <em>Os Agravos no CPC de 2015</em>. Direito Contemporâneo.</li><li>ALVIM, Teresa Arruda; DANTAS, Bruno. <em>Precedentes, Recurso Especial e Recurso Extraordinário</em>. Thomson Reuters Brasil.</li><li>THEODORO JÚNIOR, Humberto. <em>Curso de Direito Processual Civil</em>. Forense.</li></ul><h3>Fontes normativas e oficiais</h3><ul><li>Constituição da República Federativa do Brasil de 1988.</li><li>Lei 13.105/2015 — Código de Processo Civil.</li><li>Lei 12.016/2009 — mandado de segurança.</li><li>Regimentos internos do STF, STJ e tribunais locais.</li></ul><p><a href="https://www2.camara.leg.br/legin/fed/lei/2015/lei-13105-16-marco-2015-780273-normaatualizada-pl.html" target="_blank" rel="noopener">Código de Processo Civil — texto atualizado ↗</a> · <a href="https://www.planalto.gov.br/ccivil_03/constituicao/constituicao.htm" target="_blank" rel="noopener">Constituição Federal ↗</a></p><p class="legal-note">Dados editoriais devem ser conferidos na folha de rosto da edição consultada. A legislação e a jurisprudência prevalecem sobre sínteses didáticas desatualizadas.</p></div>`;
 }

function moduleHtml(m,i,progress){
 const key='m'+(i+1); const done=!!progress[key];
 const paras=m.sections.map((sec,j)=>`<section class="chapter"><h4>${sec[0]}</h4><div class="illustrated-text"><span class="legal-doodle" aria-hidden="true">${legalDoodle((i+j)%4)}</span><p class="editable-legal" data-edit-key="admin-${i}-section-${j}">${sec[1]}</p></div></section>`).join('');
 const comp=`<div class="comparison-grid">${m.comparisons.map(c=>`<div class="comparison-item"><strong>${c[0]}</strong><p>${c[1]}</p></div>`).join('')}</div>`;
 const law=`<section class="chapter"><h4>Legislação essencial</h4><ul>${m.legislation.map(x=>`<li>${x}</li>`).join('')}</ul></section>`;

const normalized=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function smartSearch(term){let q=normalized(term).trim(),out=[];if(!q)return out;
 periods.forEach((a,i)=>a.forEach(s=>{let hay=normalized(s+' '+(notes[s]||''));if(hay.includes(q))out.push({period:i,subject:s,title:s,excerpt:notes[s]&&normalized(notes[s]).includes(q)?notes[s].slice(0,140):'Disciplina do '+(i+1)+'º período'})}));
 adminModules.forEach((m,i)=>{let pieces=[m.title,m.objective,...m.sections.flat(),...m.legislation,...m.cases,...m.comparisons.flat(),...(m.source_note?[m.source_note]:[])];const edits=arqGet('arq_reader_edits',{});m.sections.forEach((x,j)=>{if(edits['admin-'+i+'-section-'+j])pieces.push(edits['admin-'+i+'-section-'+j].replace(/<[^>]*>/g,' '))});let hay=normalized(pieces.join(' '));if(hay.includes(q)){let idx=hay.indexOf(q);out.push({period:5,subject:ARQ_ADMIN,title:'Módulo '+(i+1)+' · '+m.title,excerpt:pieces.find(x=>normalized(x).includes(q))?.replace(/<[^>]*>/g,' ').slice(0,180)||''})}});
 arqGet('arq_reader_bookmarks',[]).forEach(b=>{if(normalized(b.quote+' '+b.comment).includes(q))out.push({period:5,subject:ARQ_ADMIN,title:'🔖 Marcador · '+adminModules[b.module]?.title,excerpt:b.quote.slice(0,130)})});return out.slice(0,80)}

function renderSettingsPage(){let marks=arqGet('arq_reader_bookmarks',[]),cfg=arqGet('arq_config',{});return `<h1 class="paneltitle">Configurações</h1><p class="subtitle">Preferências, biblioteca pessoal e segurança dos seus estudos.</p><div class="card settings-grid"><h3>Preferências de leitura</h3><label>Tamanho do texto <select id="cfg-font" class="field"><option value="14" ${cfg.font==='14'?'selected':''}>Normal</option><option value="16" ${cfg.font==='16'?'selected':''}>Confortável</option><option value="18" ${cfg.font==='18'?'selected':''}>Ampliado</option></select></label><h3>Seus dados</h3><p class="status-text">Edições, grifos, comentários e anotações ficam armazenados neste navegador e neste endereço. Em outro dispositivo ou navegador, importe seu backup. Não limpe os dados do site sem antes exportar uma cópia.</p><button class="primary" id="backup-arq">Exportar backup completo (.json)</button><label class="primary" style="cursor:pointer;display:inline-block;width:max-content">Importar backup (.json)<input id="import-arq" type="file" accept="application/json" style="display:none"></label><h3>Atualização da base jurídica</h3><p class="status-text">A versão atual não consulta legislação ou jurisprudência automaticamente. Use as fontes oficiais abaixo para conferir vigência e decisões recentes. A integração automática será uma etapa separada, que exige serviços de consulta e validação.</p><div class="update-links"><a href="https://www.planalto.gov.br/ccivil_03/" target="_blank" rel="noopener">Legislação federal · Planalto ↗</a><a href="https://portal.stf.jus.br/" target="_blank" rel="noopener">STF ↗</a><a href="https://www.stj.jus.br/" target="_blank" rel="noopener">STJ ↗</a><a href="https://www.cnj.jus.br/" target="_blank" rel="noopener">CNJ ↗</a></div><h3>Marcadores e comentários (${marks.length})</h3><div class="reader-panel">${marks.map(b=>`<div class="bookmark-entry"><strong>${esc(adminModules[b.module]?.title||'Módulo')}</strong><p>“${esc(b.quote)}”</p><textarea class="field" data-comment-id="${esc(b.id)}">${esc(b.comment||'')}</textarea><button data-save-comment="${esc(b.id)}">Salvar comentário</button><button data-delete-bookmark="${esc(b.id)}">Excluir marcador</button></div>`).join('')||'<p>Nenhum marcador criado ainda.</p>'}</div></div>`}
function setupExtras(){let cfg=arqGet('arq_config',{});let saveCfg=()=>arqSave('arq_config',cfg);let font=$('cfg-font');if(font)font.onchange=()=>{cfg.font=font.value;saveCfg();applyFont()};let bk=$('backup-arq');if(bk)bk.onclick=downloadBackup;let imp=$('import-arq');if(imp)imp.onchange=async()=>{try{let data=JSON.parse(await imp.files[0].text());if(!data.items||typeof data.items!=='object')throw Error('Backup inválido');if(!confirm('Importar o backup substituirá dados atuais do Arquimedes. Continuar?'))return;Object.entries(data.items).forEach(([k,v])=>{if(k.startsWith('arq_')&&typeof v==='string')localStorage.setItem(k,v)});location.reload()}catch(e){alert(e.message)}};
